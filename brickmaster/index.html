<title>Brickmaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Han+Sans&family=Bungee&family=Chakra+Petch:wght@600;700&family=Do+Hyeon&family=Fredoka:wght@600;700&family=IBM+Plex+Sans+KR:wght@500;700&family=Outfit:wght@600;800&family=Sora:wght@600;800&family=Jua&family=Lilita+One&family=Orbitron:wght@900&family=Press+Start+2P&display=swap">
<style>
/* Layout: one portrait arcade screen (420x780 logical), letterboxed and scaled to fit the phone.
   Each visual theme sets these tokens from JS (applyTheme); the values here are the neon theme. */
:root{color-scheme:dark}
#stage{
  --bg:#0a0c1c; --panel:#141939; --line:#2a3270; --ink:#eef0ff; --dim:#8c93c9;
  --gold:#ffd23f; --hot:#ff4f7b; --cool:#3ee6ff; --ov:rgba(10,12,28,.86); --btnInk:#0a0c1c; --logo2:#3ee6ff;
  --disp:"Press Start 2P", ui-monospace, monospace; --dsz:1;
  --ko:"Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#0a0c1c;overflow:hidden;overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);display:flex;align-items:center;justify-content:center}
#stage{position:relative;--s:1;touch-action:none;overflow:hidden;color:var(--ink);font-family:var(--ko);background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.crt{position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),
  radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.5) 100%)}
.btn{font-family:var(--disp);font-size:calc(var(--s)*9px*var(--dsz));line-height:1;color:var(--ink);background:var(--panel);
  border:calc(var(--s)*2px) solid var(--line);padding:calc(var(--s)*9px) calc(var(--s)*11px);cursor:pointer;border-radius:calc(var(--s)*4px)}
.btn.ko{font-family:var(--ko);font-size:calc(var(--s)*17px);padding:calc(var(--s)*10px) calc(var(--s)*16px)}
.btn:focus-visible,.card:focus-visible,.buy:focus-visible{outline:calc(var(--s)*2px) solid var(--gold);outline-offset:calc(var(--s)*2px)}
.btn.big{font-size:calc(var(--s)*14px*var(--dsz));padding:calc(var(--s)*16px) calc(var(--s)*30px);background:var(--gold);color:var(--btnInk);border-color:var(--gold);box-shadow:calc(var(--s)*4px) calc(var(--s)*4px) 0 var(--hot);animation:pulse 1.4s ease-in-out infinite}
.btn.big:active{transform:translate(calc(var(--s)*2px),calc(var(--s)*2px));box-shadow:calc(var(--s)*2px) calc(var(--s)*2px) 0 var(--hot)}
.btn.ad{border-color:var(--cool);color:var(--cool)}
.btn.ad::after{content:"AD";font-family:var(--disp);font-size:calc(var(--s)*7px*var(--dsz));margin-left:calc(var(--s)*8px);padding:calc(var(--s)*3px);background:var(--cool);color:var(--bg);vertical-align:middle}
#snd{position:absolute;left:calc(var(--s)*14px);bottom:calc(var(--s)*12px)}
#recall{position:absolute;right:calc(var(--s)*14px);bottom:calc(var(--s)*12px);font-family:var(--ko);font-size:calc(var(--s)*15px);padding:calc(var(--s)*7px) calc(var(--s)*12px)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*13px);
  background:var(--ov);padding:calc(var(--s)*24px);text-align:center;box-sizing:border-box}
#title{background:linear-gradient(var(--ov) 0 30%,transparent 46%,transparent 54%,var(--ov) 72%)}
.logo{font-family:var(--disp);font-size:calc(var(--s)*30px*var(--dsz));line-height:1.15;color:var(--gold);text-shadow:calc(var(--s)*3px) calc(var(--s)*3px) 0 var(--hot),calc(var(--s)*6px) calc(var(--s)*6px) 0 var(--logo2);margin:0;animation:bob 2.4s ease-in-out infinite}
.sub{font-size:calc(var(--s)*20px);color:var(--cool);margin:0}
.picker{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:calc(var(--s)*10px);width:100%;background:var(--panel);border:calc(var(--s)*2px) solid var(--line);border-radius:calc(var(--s)*6px);padding:calc(var(--s)*8px);box-sizing:border-box}
.picker .btn{font-size:calc(var(--s)*14px);padding:calc(var(--s)*10px) calc(var(--s)*12px)}
.thTag{font-size:calc(var(--s)*21px);margin:0;color:var(--gold)}
.thNo{font-family:var(--disp);font-size:calc(var(--s)*7px*var(--dsz));color:var(--dim);margin:0}
.small{font-family:var(--disp);font-size:calc(var(--s)*8px*var(--dsz));color:var(--dim);line-height:1.8;margin:0}
.note{font-size:calc(var(--s)*15px);color:var(--dim);margin:0}
.gold{font-family:var(--disp);font-size:calc(var(--s)*11px*var(--dsz));color:var(--gold);margin:0}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--s)*10px)}
h2{font-family:var(--disp);font-size:calc(var(--s)*20px*var(--dsz));color:var(--gold);margin:0;text-shadow:calc(var(--s)*3px) calc(var(--s)*3px) 0 var(--hot)}
#metaList{display:grid;gap:calc(var(--s)*8px);width:100%}
/* Level-up: three tall cards side by side that flip in, behind them slow light rays */
#lvl{gap:calc(var(--s)*6px);padding-inline:calc(var(--s)*14px);overflow:hidden}
#lvl > *{position:relative}
#lvl .rays{position:absolute;left:50%;top:44%;width:calc(var(--s)*900px);height:calc(var(--s)*900px);margin:calc(var(--s)*-450px) 0 0 calc(var(--s)*-450px);pointer-events:none;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--gold) 16%,transparent) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:spin 14s linear infinite,raysIn .35s ease-out both}
.lvlKick{font-family:var(--disp);font-size:calc(var(--s)*10px*var(--dsz));letter-spacing:.3em;color:var(--cool);margin:0;animation:fadeUp .25s ease-out both}
.lvlNum{font-family:var(--disp);font-size:calc(var(--s)*44px*var(--dsz));line-height:1;color:var(--gold);margin:0;text-shadow:0 0 calc(var(--s)*24px) color-mix(in srgb,var(--gold) 70%,transparent);animation:numPop .4s cubic-bezier(.2,1.8,.4,1) both}
#lvl .note{margin-bottom:calc(var(--s)*10px)}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--s)*9px);width:100%;perspective:calc(var(--s)*800px)}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*7px);min-width:0;text-align:center;cursor:pointer;
  background:var(--panel);color:var(--ink);border:calc(var(--s)*2px) solid var(--c,var(--line));padding:calc(var(--s)*14px) calc(var(--s)*8px) calc(var(--s)*12px);border-radius:calc(var(--s)*14px);font-family:var(--ko);
  box-shadow:0 0 calc(var(--s)*22px) color-mix(in srgb,var(--c) 35%,transparent),0 calc(var(--s)*8px) calc(var(--s)*20px) rgba(0,0,0,.35);
  animation:flipIn .32s cubic-bezier(.2,1.5,.4,1) backwards;transition:transform .16s ease,opacity .16s ease,box-shadow .16s ease}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:shine .7s ease-out .3s both;pointer-events:none}
.card:nth-child(2)::after{animation-delay:.36s}.card:nth-child(3)::after{animation-delay:.42s}
.card:active{transform:scale(.96)}
.card .ic{display:grid;place-items:center;width:calc(var(--s)*58px);height:calc(var(--s)*58px);border-radius:50%;background:var(--c);color:#0a0c1c;
  box-shadow:0 0 0 calc(var(--s)*4px) color-mix(in srgb,var(--c) 25%,transparent),0 0 calc(var(--s)*18px) var(--c)}
.card .ic svg{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card .cn{font-size:calc(var(--s)*18px);line-height:1.1}
.card .cd{font-size:calc(var(--s)*13px);line-height:1.3;color:var(--dim);flex:1}
.card .lv{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--s)*3px)}
.card .lv i{width:calc(var(--s)*7px);height:calc(var(--s)*7px);border-radius:50%;background:var(--line)}
.card .lv i.on{background:var(--c)}
.card .lv i.nx{background:var(--c);animation:blink .5s ease-in-out infinite alternate}
.card .lvt{font-family:var(--disp);font-size:calc(var(--s)*8px*var(--dsz));color:var(--dim)}
.card .new{position:absolute;top:calc(var(--s)*6px);right:calc(var(--s)*-22px);transform:rotate(35deg);background:var(--hot);color:#fff;font-family:var(--disp);font-size:calc(var(--s)*7px*var(--dsz));padding:calc(var(--s)*3px) calc(var(--s)*24px)}
.card.chosen{transform:scale(1.1);z-index:2;box-shadow:0 0 calc(var(--s)*40px) var(--c),0 0 0 calc(var(--s)*3px) #fff}
.card.dim{opacity:.18;transform:scale(.9)}
.locked .card{pointer-events:none}
@keyframes flipIn{from{transform:rotateY(95deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes numPop{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(calc(var(--s)*10px));opacity:0}to{transform:none;opacity:1}}
@keyframes raysIn{from{opacity:0;transform:scale(.4)}to{opacity:1}}
@keyframes spin{to{rotate:360deg}}
@keyframes blink{to{opacity:.35}}
.meta{display:grid;grid-template-columns:1fr auto;align-items:center;gap:calc(var(--s)*10px);background:var(--panel);border:calc(var(--s)*2px) solid var(--line);border-radius:calc(var(--s)*6px);padding:calc(var(--s)*9px) calc(var(--s)*12px);text-align:left}
.meta .mn{font-size:calc(var(--s)*19px)}
.meta .md{font-size:calc(var(--s)*14px);color:var(--dim)}
.pips{display:flex;flex-wrap:wrap;gap:calc(var(--s)*3px);margin-top:calc(var(--s)*5px)}
.pips i{width:calc(var(--s)*8px);height:calc(var(--s)*8px);background:var(--line)}
.pips i.on{background:var(--gold)}
.buy{font-family:var(--disp);font-size:calc(var(--s)*9px*var(--dsz));min-width:calc(var(--s)*74px);padding:calc(var(--s)*10px) calc(var(--s)*8px);background:var(--gold);color:var(--btnInk);border:0;border-radius:calc(var(--s)*4px);cursor:pointer}
.buy:disabled{background:var(--line);color:var(--dim);cursor:default}
#stats{display:grid;grid-template-columns:1fr auto;gap:calc(var(--s)*7px) calc(var(--s)*24px);font-size:calc(var(--s)*17px);text-align:left;width:80%}
#stats span:nth-child(even){font-family:var(--disp);font-size:calc(var(--s)*12px*var(--dsz));color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
#build{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--s)*6px)}
#build span{font-family:var(--disp);font-size:calc(var(--s)*8px*var(--dsz));padding:calc(var(--s)*6px);background:var(--c);color:#0a0c1c;border-radius:calc(var(--s)*3px)}
/* Neon Glass (default world): soft glass panels, pill buttons, gradient type instead of hard pixel shadows */
#stage[data-th="neon"] .ov{backdrop-filter:blur(calc(var(--s)*8px));-webkit-backdrop-filter:blur(calc(var(--s)*8px))}
#stage[data-th="neon"] .logo{background:linear-gradient(100deg,#5ef2e0 0%,#ffffff 45%,#9d8cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 calc(var(--s)*14px) rgba(94,242,224,.45));letter-spacing:.04em}
#stage[data-th="neon"] .sub{color:var(--dim);letter-spacing:.12em;font-size:calc(var(--s)*15px)}
#stage[data-th="neon"] .btn{border-radius:calc(var(--s)*12px);border:1px solid var(--line);background:rgba(255,255,255,.04)}
#stage[data-th="neon"] .btn.big{background:linear-gradient(120deg,#5ef2e0,#9d8cff);border:0;border-radius:999px;color:#070912;box-shadow:0 0 calc(var(--s)*28px) rgba(94,242,224,.45),inset 0 1px 0 rgba(255,255,255,.6);letter-spacing:.08em}
#stage[data-th="neon"] .btn.big:active{transform:scale(.97);box-shadow:0 0 calc(var(--s)*14px) rgba(94,242,224,.45)}
#stage[data-th="neon"] .btn.ad{border-color:rgba(94,242,224,.6)}
#stage[data-th="neon"] .picker,#stage[data-th="neon"] .meta{border:1px solid var(--line);border-radius:calc(var(--s)*16px);background:rgba(17,21,42,.72)}
#stage[data-th="neon"] .card{border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:calc(var(--s)*18px);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,#141933),#0c0f20 70%)}
#stage[data-th="neon"] h2{text-shadow:0 0 calc(var(--s)*16px) rgba(255,198,107,.55);letter-spacing:.06em}
#stage[data-th="neon"] .buy{border-radius:999px}
#stage[data-th="neon"] .pips i{border-radius:50%}
#stage[data-th="neon"] #build span{border-radius:999px}
/* Stage map: one panel per world in that world's colours, four stage nodes on a zigzag path */
#map{justify-content:flex-start;gap:calc(var(--s)*8px)}
#mapList{width:100%;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:grid;gap:calc(var(--s)*10px);padding:calc(var(--s)*2px);box-sizing:border-box}
.world{background:linear-gradient(160deg,var(--wp),var(--wb));border:calc(var(--s)*2px) solid color-mix(in srgb,var(--wa) 55%,transparent);border-radius:calc(var(--s)*16px);padding:calc(var(--s)*10px) calc(var(--s)*12px);text-align:left;color:var(--wi)}
.world header{display:flex;align-items:baseline;gap:calc(var(--s)*8px)}
.world header b{font-family:var(--wf);font-size:calc(var(--s)*11px);color:var(--wa)}
.world header span{font-size:calc(var(--s)*18px)}
.world p{margin:calc(var(--s)*2px) 0 calc(var(--s)*6px);font-size:calc(var(--s)*13px);color:var(--wd)}
.world.locked{filter:grayscale(.85) brightness(.7)}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--s)*6px);position:relative}
.path::before{content:"";position:absolute;left:12%;right:12%;top:calc(var(--s)*30px);border-top:calc(var(--s)*3px) dashed color-mix(in srgb,var(--wa) 45%,transparent)}
.node{position:relative;display:grid;justify-items:center;gap:calc(var(--s)*3px);background:none;border:0;padding:0;cursor:pointer;color:var(--wi)}
.node:nth-child(even){margin-top:calc(var(--s)*14px)}
.node .dot{display:grid;place-items:center;width:calc(var(--s)*52px);height:calc(var(--s)*52px);border-radius:50%;background:var(--wa);color:#0a0c1c;font-family:var(--wf);font-size:calc(var(--s)*13px);font-weight:700;box-shadow:0 calc(var(--s)*4px) 0 color-mix(in srgb,var(--wa) 45%,#000)}
.node .dot svg{width:45%;height:45%;fill:none;stroke:currentColor;stroke-width:2.4}
.node.lock .dot{background:#3a3f55;color:#9aa0b8;box-shadow:none}
.node.cur .dot{animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 0 calc(var(--s)*4px) color-mix(in srgb,var(--wa) 40%,transparent),0 0 calc(var(--s)*18px) var(--wa)}
.node.sel .dot{outline:calc(var(--s)*3px) solid #fff;outline-offset:calc(var(--s)*3px)}
.node .st{font-size:calc(var(--s)*12px);letter-spacing:.05em}
.node .st i,.stars i{font-style:normal;color:rgba(128,128,150,.45)}
.node .st i.on{color:#ffd23f}
.mapSel{width:100%;display:grid;gap:calc(var(--s)*8px);background:var(--panel);border:calc(var(--s)*2px) solid var(--line);border-radius:calc(var(--s)*14px);padding:calc(var(--s)*10px);box-sizing:border-box}
.mapSel .note{color:var(--ink);font-size:calc(var(--s)*15px)}
.mapSel .btn.big:disabled{filter:grayscale(1);opacity:.5;animation:none}
#endless:disabled{opacity:.45}
.stars{margin:0;font-size:calc(var(--s)*44px);line-height:1;letter-spacing:.08em}
.stars i{display:inline-block}
.stars i.on{color:#ffd23f;text-shadow:0 0 calc(var(--s)*18px) rgba(255,210,63,.8);animation:starPop .45s cubic-bezier(.2,1.8,.4,1) both}
.newNote{margin:0;font-size:calc(var(--s)*17px);color:var(--cool)}
#over.win h2{animation:numPop .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starPop{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
#shieldOffer{position:absolute;left:calc(var(--s)*12px);right:calc(var(--s)*12px);bottom:calc(var(--s)*92px);display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:calc(var(--s)*10px);
  padding:calc(var(--s)*10px) calc(var(--s)*12px);background:color-mix(in srgb,var(--panel) 92%,transparent);border:calc(var(--s)*2px) solid #6ec8ff;border-radius:calc(var(--s)*14px);
  box-shadow:0 0 calc(var(--s)*24px) rgba(110,200,255,.5);color:var(--ink);overflow:hidden;z-index:5}
#shieldOffer.go{animation:offerIn .35s cubic-bezier(.2,1.6,.4,1) both}
#shieldOffer svg{width:calc(var(--s)*30px);height:calc(var(--s)*30px);fill:#6ec8ff}
#shieldOffer b{display:block;font-size:calc(var(--s)*17px)}
#shieldOffer span{display:block;font-size:calc(var(--s)*12px);color:var(--dim)}
#shieldOffer .btn{padding:calc(var(--s)*8px) calc(var(--s)*10px)}
#shieldOffer .bar{position:absolute;left:0;bottom:0;height:calc(var(--s)*3px);width:100%;background:#6ec8ff;transform-origin:left}
#shieldOffer.go .bar{animation:drain 6s linear both}
@keyframes offerIn{from{transform:translateY(calc(var(--s)*60px));opacity:0}to{transform:none;opacity:1}}
@keyframes drain{to{transform:scaleX(0)}}
/* ---- Design drafts (v0.8): soft glass / clay / flat over the painted worlds ---- */
#stage[data-dir="glass"] .ov{backdrop-filter:blur(calc(var(--s)*10px)) saturate(1.15);-webkit-backdrop-filter:blur(calc(var(--s)*10px)) saturate(1.15)}
#stage[data-dir="glass"] .btn{border-radius:calc(var(--s)*14px);border:1px solid rgba(255,255,255,.7);background:color-mix(in srgb,var(--panel) 70%,transparent);color:var(--ink)}
#stage[data-dir="glass"] .btn.big{background:linear-gradient(120deg,var(--cool),var(--logo2));color:#fff;border:0;border-radius:999px;box-shadow:0 calc(var(--s)*8px) calc(var(--s)*24px) color-mix(in srgb,var(--cool) 45%,transparent);text-shadow:0 1px 2px rgba(0,0,0,.2);letter-spacing:.06em}
#stage[data-dir="glass"] .btn.big:active{transform:scale(.97)}
#stage[data-dir="glass"] .logo{background:linear-gradient(100deg,var(--cool),var(--logo2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 calc(var(--s)*3px) calc(var(--s)*8px) rgba(255,255,255,.7));letter-spacing:.02em}
#stage[data-dir="glass"] h2{color:var(--ink);text-shadow:none;letter-spacing:.04em}
#stage[data-dir="glass"] .sub{color:var(--dim);letter-spacing:.14em;font-size:calc(var(--s)*15px)}
#stage[data-dir="glass"] .card,#stage[data-dir="glass"] .meta,#stage[data-dir="glass"] .mapSel{background:var(--panel);border:1px solid rgba(255,255,255,.75);border-radius:calc(var(--s)*20px);box-shadow:0 calc(var(--s)*10px) calc(var(--s)*28px) rgba(60,40,120,.18)}
#stage[data-dir="glass"] .card .ic{color:#fff}

#stage[data-dir="clay"] .btn{border:0;border-radius:calc(var(--s)*18px);background:var(--panel);color:var(--ink);box-shadow:0 calc(var(--s)*4px) 0 rgba(60,30,90,.2)}
#stage[data-dir="clay"] .btn.big{background:var(--cool);color:#fff;border-radius:calc(var(--s)*24px);box-shadow:0 calc(var(--s)*6px) 0 color-mix(in srgb,var(--cool) 55%,#2c2a4a)}
#stage[data-dir="clay"] .btn.big:active{transform:translateY(calc(var(--s)*4px));box-shadow:0 calc(var(--s)*2px) 0 color-mix(in srgb,var(--cool) 55%,#2c2a4a)}
#stage[data-dir="clay"] .logo{color:#fff;text-shadow:0 calc(var(--s)*4px) 0 var(--cool),0 calc(var(--s)*8px) 0 var(--logo2)}
#stage[data-dir="clay"] h2{color:#fff;text-shadow:0 calc(var(--s)*3px) 0 var(--cool)}
#stage[data-dir="clay"] .card{border:0;border-radius:calc(var(--s)*24px);box-shadow:0 calc(var(--s)*6px) 0 color-mix(in srgb,var(--c) 60%,#2c2a4a)}

<script>
(() => {
// ---- 00-config.js ----
'use strict';
// Field geometry (logical units; the canvas is scaled to the screen).
const W = 420, H = 780, COLS = 7, CW = 60, RH = 36, TOP = 76, ROWS = 17;
const FB = TOP + ROWS * RH;   // red line (688): a brick reaching it costs HP
const LY = 716;               // launcher line
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const $ = id => document.getElementById(id);

// Balance knobs. Every tuning number lives here; t = turn number.
const BAL = {
  startBalls: 5,
  ballSpeed: 760, fireGap: 0.055,
  hp: t => Math.max(1, Math.round(t * (1 + t / 12) * Math.pow(1.045, t))), // exponential tail ends runaway builds
  density: t => Math.min(0.82, 0.48 + t * 0.012),
  doubleHp: 0.15,
  bomb: t => t > 2 ? 0.06 : 0,
  chest: t => t > 3 ? 0.025 : 0,
  steel: t => t > 8 ? 0.05 : 0,
  slime: t => t > 5 ? 0.06 : 0,
  orb: 0.4,
  laser: t => t > 4 ? 0.14 : 0,
  bossEvery: 10, bossHp: 6,
  stageHp: n => 1 + 0.22 * n, // brick HP multiplier for stage n (0-based)
  xpNeed: lvl => Math.round(3 + lvl * 2 + 0.25 * Math.pow(lvl, 2.2)), // fast early levels, slow after ~15
  goldPerKill: 0.25, goldPerTurn: 1, goldBoss: 25, goldChapter: ch => ch * 15,
};

const chapterOf = t => Math.ceil(t / BAL.bossEvery);
const chapterName = ch => TH.chapters[(ch - 1) % TH.chapters.length];

// DOM
const cv = $('cv'), ctx = cv.getContext('2d');
const stage = $('stage'), wrap = $('wrap');
const titleEl = $('title'), lvlEl = $('lvl'), cardsEl = $('cards'), overEl = $('over'), shopEl = $('shop');
const recallEl = $('recall'), sndEl = $('snd');

// ---- 10-audio.js ----
// Chiptune blips synthesized with WebAudio. Audio starts on the first tap.
let AC = null, master = null, noiseBuf = null, muted = false;
const lastSfx = {};
function ensureAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor();
      master = AC.createGain(); master.gain.value = 0.7;
      master.connect(comp).connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.4, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function gate(key, ms) {
  if (!AC || muted) return false;
  const t = AC.currentTime * 1000;
  if (lastSfx[key] && t - lastSfx[key] < ms) return false;
  lastSfx[key] = t; return true;
}
function tone(f, dur, type = 'square', vol = 0.05, slide = 0, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq = 900) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur);
}
const sfx = {
  shoot() { if (gate('shoot', 45)) tone(880, 0.025, 'square', 0.018); },
  hit() { if (gate('hit', 28)) tone(260 + rnd() * 80, 0.03, 'square', 0.03); },
  steel() { if (gate('steel', 40)) tone(1800 + rnd() * 300, 0.04, 'triangle', 0.03); },
  wall() { if (gate('wall', 60)) tone(180, 0.02, 'triangle', 0.02); },
  brk(c) { if (!gate('brk', 32)) return; const f = 330 * Math.pow(2, Math.min(c, 24) / 12); tone(f, 0.09, 'triangle', 0.09); tone(f * 2, 0.05, 'square', 0.02); },
  boom() { if (!gate('boom', 70)) return; noise(0.28, 0.22, 800); tone(120, 0.22, 'sine', 0.2, 0.35); },
  zap() { if (gate('zap', 60)) tone(1500, 0.09, 'sawtooth', 0.03, 0.25); },
  laser() { if (gate('laser', 50)) { tone(2200, 0.12, 'sawtooth', 0.035, 0.2); noise(0.08, 0.05, 4000); } },
  slime() { if (gate('slime', 60)) tone(200, 0.12, 'sine', 0.1, 2.2); },
  orb() { if (!gate('orb', 50)) return; tone(988, 0.05, 'square', 0.04); tone(1318, 0.08, 'square', 0.04, 0, 0.05); },
  lvl() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.1, 'square', 0.05, 0, i * 0.07)); },
  pick() { tone(784, 0.06, 'square', 0.05); tone(1175, 0.1, 'square', 0.05, 0, 0.06); },
  crunch(n) { if (!gate('crunch', 40)) return; noise(0.12, 0.07 + Math.min(n, 10) * 0.012, 5200); tone(95, 0.12, 'sine', 0.1, 0.5); },
  slam(lv) { noise(0.4 + lv * 0.1, 0.22 + lv * 0.04, 1600); tone(80 - lv * 8, 0.45, 'sine', 0.3, 0.35); if (lv >= 2) tone(1400, 0.3, 'sawtooth', 0.03, 0.3, 0.05); },
  whoosh() { noise(0.5, 0.1, 700); tone(500, 0.5, 'sine', 0.04, 0.3); },
  beat() { if (!gate('beat', 300)) return; tone(62, 0.12, 'sine', 0.28); tone(55, 0.14, 'sine', 0.22, 0, 0.17); },
  tick() { if (gate('tick', 45)) tone(1760 + rnd() * 400, 0.03, 'square', 0.02); },
  coin() { tone(1318, 0.06, 'square', 0.04); tone(1760, 0.14, 'square', 0.04, 0, 0.06); },
  hurt() { tone(170, 0.35, 'sawtooth', 0.12, 0.45); noise(0.2, 0.15, 400); },
  boss() { [196, 185, 175].forEach((f, i) => tone(f, 0.18, 'sawtooth', 0.08, 0, i * 0.2)); },
  clear() { [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone(f, 0.12, 'square', 0.05, 0, i * 0.08)); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, 'triangle', 0.1, 0, i * 0.18)); },
};
let lastBuzz = 0;
function buzz(ms) {
  const t = performance.now(); if (t - lastBuzz < 70) return; lastBuzz = t;
  try {
    // inside the Expo app, native haptics (iOS has no navigator.vibrate)
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ t: 'haptic', s: ms >= 60 ? 'heavy' : ms >= 25 ? 'medium' : 'light' }));
    else if (navigator.vibrate) navigator.vibrate(ms);
  } catch (e) {}
}

// ---- 20-data.js ----
// In-run upgrade cards. desc(n) describes the card at its next level n.
const zapEvery = l => Math.max(4, 10 - l * 2);
const fmtDmg = d => Number.isInteger(d) ? String(d) : d.toFixed(1);
const UPG = {
  multi:  { tag: 'BALL+3', name: '공 추가',   max: 99, col: '#3ee6ff', w: 3,   desc: () => '발사하는 공 +3개', apply() { S.balls += 3; } },
  power:  { tag: 'DMG+1',  name: '공격력',    max: 99, col: '#ff6b6b', w: 3,   desc: () => `모든 공격 피해 +1 (현재 ${fmtDmg(S.dmg)})`, apply() { S.dmg += 1; } },
  crit:   { tag: 'CRIT',   name: '치명타',    max: 4,  col: '#ffd23f', w: 2,   desc: n => `${12 * n}% 확률로 3배 피해`, apply() { S.crit = 0.12 * S.lv.crit; } },
  fire:   { tag: 'FIRE',   name: '화염탄',    max: 5,  col: '#ff8a3d', w: 2,   desc: n => `벽돌을 부수면 주변에 불꽃 폭발 (공격력 ×${n + 1})`, apply() {} },
  chain:  { tag: 'ZAP',    name: '연쇄 번개', max: 5,  col: '#a5e9ff', w: 2,   desc: n => `${zapEvery(n)}번 맞힐 때마다 번개가 벽돌 ${n + 1}개를 지짐`, apply() {} },
  pierce: { tag: 'PIERCE', name: '관통',      max: 4,  col: '#b98cff', w: 1.5, desc: n => `${15 * n}% 확률로 벽돌을 뚫고 지나감`, apply() { S.pierce = 0.15 * S.lv.pierce; } },
  split:  { tag: 'SPLIT',  name: '분열',      max: 4,  col: '#ff9be0', w: 2,   desc: n => `공이 처음 맞힐 때 ${n + 1}갈래로 갈라짐`, apply() {} },
  rush:   { tag: 'RUSH',   name: '폭주',      max: 4,  col: '#ff6a3d', w: 2,   desc: n => `튕길 때마다 그 공의 피해 +${12 * n}%, 점점 빨라짐`, apply() {} },
  iron:   { tag: 'IRON',   name: '철구',      max: 3,  col: '#b8c2d9', w: 1.6, desc: n => `매 턴 ${n >= 3 ? '첫 공 2개' : '첫 공'}가 쇠공: 벽돌을 모두 뚫고 ${n + 2}배 피해`, apply() {} },
  encore: { tag: 'ENCORE', name: '앙코르',    max: 3,  col: '#ffe14d', w: 1.6, desc: n => `턴이 끝날 때 ${15 * n}% 확률로 공 전부를 한 번 더 발사`, apply() {} },
  bounce: { tag: 'BOUNCE', name: '바운스 패드', max: 3, col: '#5effa8', w: 1.8, desc: n => `공이 바닥에 닿으면 ${n}번까지 다시 튕겨 오름`, apply() {} },
  acid:   { tag: 'ACID',   name: '부식',      max: 4,  col: '#a6ff3d', w: 1.8, desc: n => `맞힌 벽돌에 부식이 쌓여 턴이 끝날 때 한꺼번에 피해 (${n}중첩/타격)`, apply() {} },
  xp:     { tag: 'XP',     name: '학습',      max: 4,  col: '#c6ff5e', w: 1,   desc: n => `경험치 획득 +${40 * n}%`, apply() {} },
};

// Card icons: 24x24 stroke paths drawn in the card's colour circle.
const ICONS = {

  power: '<path d="M14.5 3.5h6v6l-9.5 9.5-6-6z"/><path d="M4 16l4 4M2.5 21.5l3-3"/>',

};

const FONT = {
  pixel: '"Press Start 2P", ui-monospace, monospace',
  lilita: '"Lilita One", "Jua", system-ui, sans-serif',
  orbitron: '"Orbitron", "Black Han Sans", system-ui, sans-serif',

  blackHan: '"Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif',
};
const lerpHex = (a, b, k) => {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((pa >> s) & 255) * (1 - k) + ((pb >> s) & 255) * k);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
};
const rampOf = stops => k => {
  const x = clamp(k, 0, 0.9999) * (stops.length - 1), i = Math.floor(x);
  return lerpHex(stops[i], stops[i + 1], x - i);
};

// Static field layers are cached per theme and chapter.
const fieldCache = {};
function cachedLayer(key, paint) {
  if (fieldCache[key]) return fieldCache[key];
  const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2;
  const g = c.getContext('2d'); g.scale(2, 2); paint(g);
  return fieldCache[key] = c;
}

// ---------- painting helpers ----------
function hill(g, base, amp, freq, phase, col) {
  g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W; x += 6) g.lineTo(x, base + Math.sin(x * freq + phase) * amp + Math.sin(x * freq * 2.3 + phase * 1.7) * amp * 0.35);
  g.lineTo(W, H); g.closePath(); g.fill();
}
function vgrad(g, y0, y1, stops) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c));
  return gr;
}
function softBlob(g, x, y, rx, ry, col, a) {
  g.save(); g.globalAlpha = a; g.translate(x, y); g.scale(rx / ry, 1);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, ry);
  gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, ry, 0, Math.PI * 2); g.fill(); g.restore();
}
function cloudBank(g, y, r, col, seed) {
  g.fillStyle = col; g.beginPath();
  for (let x = -r; x < W + r; x += r * 0.9) { const rr = r * (0.75 + ((x * 13 + seed) % 7) / 14); g.moveTo(x + rr, y); g.arc(x, y, rr, 0, Math.PI * 2); }
  g.rect(0, y, W, H - y); g.fill();
}

function inkFor(col) {

// Progress lives in this browser only (localStorage). Every access is guarded:
// private windows and blocked storage must still give a playable game.
const SAVE_KEY = 'brickmaster.save.v1';
let SAVE = { gold: 0, bestTurn: 0, bestChapter: 0, runs: 0, meta: {}, worlds: 1, theme: 'neon', stars: {}, unlocked: 0 };
function loadSave() {
  try {
    // inside the Expo app the native copy (window.__BM_SAVE) wins; it survives WebView storage resets
    let raw = typeof window.__BM_SAVE === 'string' && window.__BM_SAVE ? window.__BM_SAVE : null;
    if (!raw) { try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {} }
    const s = JSON.parse(raw || 'null');
    if (s && typeof s === 'object') SAVE = Object.assign(SAVE, s, { meta: Object.assign({}, s.meta) });
    if (!SAVE.bestTurn) SAVE.bestTurn = +localStorage.getItem('brickrogue.best') || 0; // prototype record
  } catch (e) {}
  SAVE.worlds = clamp(Math.floor(+SAVE.worlds) || 1, 1, WORLD_ORDER.length);
  SAVE.unlocked = clamp(Math.floor(+SAVE.unlocked) || 0, 0, 999);
  if (!SAVE.stars || typeof SAVE.stars !== 'object') SAVE.stars = {};
  // v0.7 removed the armour upgrade (one life only): refund what was spent on it
  if (SAVE.meta.hp > 0) {
    for (let l = 0; l < SAVE.meta.hp; l++) SAVE.gold += Math.round(120 * Math.pow(1.45, l) / 5) * 5;
    SAVE.refunded = true;
  }
  delete SAVE.meta.hp;
  for (const k of Object.keys(META)) SAVE.meta[k] = clamp(+SAVE.meta[k] || 0, 0, META[k].max);
}
function writeSave() {
  const json = JSON.stringify(SAVE);
  try { localStorage.setItem(SAVE_KEY, json); } catch (e) {}
  // inside the Expo app the save is also kept in native storage
  try { window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify({ t: 'save', data: json })); } catch (e) {}
}

function setRect(br) { br.X = br.c * CW + 2; br.Y = TOP + br.r * RH + 2; br.Wd = br.span * CW - 4; br.Ht = RH - 4; }
function addBrick(o, slide) {

  setRect(br); S.bricks.push(br);

}

}

function spawnRow(t, slide = true) {
  const h = Math.max(1, Math.round(BAL.hp(t) * STG.hpMul)), used = new Array(COLS).fill(false);
  if (t % BAL.bossEvery === 0) {
    const c = Math.floor(rnd() * (COLS - 2));
    addBrick({ c, r: 0, span: 3, type: 'boss', hp: h * BAL.bossHp, chapter: chapterOf(t) }, slide);
    used[c] = used[c + 1] = used[c + 2] = true;
    showBanner('BOSS', STG.endless ? `챕터 ${chapterOf(t)} 보스가 나타났다` : `보스 ${Math.min(chapterOf(t), STG.bosses)}/${STG.bosses} 등장`, TH.css.hot);
    sfx.boss();
  }
  let placed = 0;
  for (let c = 0; c < COLS; c++) {
    if (used[c] || rnd() > chance('density', t)) continue;
    let type = 'n', hp = rnd() < BAL.doubleHp ? h * 2 : h, acc = 0;
    const r = rnd();
    if (r < (acc += chance('bomb', t))) { type = 'bomb'; hp = Math.ceil(h * 0.6); }
    else if (r < (acc += chance('chest', t))) { type = 'chest'; hp = h * 2; }
    else if (r < (acc += chance('steel', t))) { type = 'steel'; hp = h * 3; }
    else if (r < (acc += chance('slime', t))) { type = 'slime'; hp = Math.ceil(h * 1.2); }
    addBrick({ c, r: 0, span: 1, type, hp }, slide); used[c] = true; placed++;
  }

  for (let c = 0; c < COLS; c++) if (!used[c]) free.push(c);
  const take = () => free.splice(Math.floor(rnd() * free.length), 1)[0];
  while (placed < 2 && t % BAL.bossEvery !== 0 && free.length > 1) { addBrick({ c: take(), r: 0, span: 1, type: 'n', hp: h }, slide); placed++; }
  // remember how full the row was, so clearing a full row can be celebrated
  const rowBricks = S.bricks.filter(b => b.r === 0 && !b.dead && !isItem(b));
  for (const b of rowBricks) b.rowSize = rowBricks.length;
  if (free.length && rnd() < chance('orb', t)) addBrick({ c: take(), r: 0, span: 1, type: 'orb', hp: 1 }, slide);
  if (free.length && rnd() < chance('laser', t)) addBrick({ c: take(), r: 0, span: 1, type: rnd() < 0.5 ? 'lzh' : 'lzv', hp: 1 }, slide);
}

    else if (kind === 'coin') { if (rnd() < 0.5) { p.kind = 'coin'; p.size = 3 + rnd() * 2; } else p.kind = 'square'; }
    else if (kind === 'spark') { p.g = 120; p.size = 2 + rnd() * 2; p.vx *= 1.4; p.vy *= 1.4; }
    else if (kind === 'shard') { p.size = 3 + rnd() * 5; p.g = 900; }
    parts.push(p);
  }
}
function shake(a) { S.shake = Math.min(14, S.shake + a * (RM ? 0.25 : 1)); }
function showBanner(title, sub, col) { S.banner = { title, sub, col, life: 2, max: 2 }; }

// ---- 50-combat.js ----
// Damage, kills, explosions, lasers, XP and gold.

function gainXp(n) {
  S.xp += n * (S.xpBase + 0.4 * S.lv.xp);
  while (S.xp >= S.xpNeed) {
    S.xp -= S.xpNeed; S.level++; S.pendingLevels++; S.xpFlash = 1;
    S.xpNeed = BAL.xpNeed(S.level);
    texts.push(mkText(W / 2, 360, 'LEVEL UP!', TH.css.gold, 1.1, 18));
    sfx.lvl();
  }
}
function addGold(n, x, y) {
  S.gold += n;
  if (x !== undefined) {
    texts.push(mkText(x, y, '+' + Math.round(n) + 'G', TH.css.gold, 1.2, 12));
    for (let i = 0; i < Math.min(12, 2 + n / 3); i++) flyCoin(x + (rnd() - 0.5) * 30, y + (rnd() - 0.5) * 20);
  }
}
// A cosmetic coin that arcs up to the HUD gold counter.
function flyCoin(x, y) {
  if (flyers.length > 60) return;
  flyers.push({ sx: x, sy: y, cx: x + (rnd() - 0.5) * 160, cy: y - 60 - rnd() * 80, t: 0, dur: 0.55 + rnd() * 0.3 });
}
const COMBO_MILES = [8, 15, 25, 40, 60];

function dealDamage(br, d, crit) {
  if (br.dead || isItem(br)) return;
  br.col = brickColor(br); // colour while still alive, for shards
  br.hp -= d; br.flash = 1;
  br.kx = (br.kx || 0) + (br.kdx || 0) * 2.5; br.ky = (br.ky || 0) + (br.kdy || 0) * 2.5;
  if (crit) texts.push(mkText(br.X + br.Wd / 2, br.Y, 'CRIT ' + fmtDmg(Math.round(d * 10) / 10), TH.css.gold, 0.7, 9));
  if (br.hp <= 1e-6) kill(br);
}

// ---------- break feel ----------
// A dying brick shatters into triangular shards that fly along the hit direction.
function shatter(br) {
  const w = br.Wd, h = br.Ht, col = br.col || brickColor(br), nx = br.span > 1 ? 6 : 3, ny = 2;
  const jx = w / nx * 0.3, jy = h / ny * 0.3;
  const P = [];
  for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) {
    const edge = i === 0 || i === nx || j === 0 || j === ny;
    P.push([i * w / nx + (edge ? 0 : (rnd() - 0.5) * jx * 2), j * h / ny + (edge ? 0 : (rnd() - 0.5) * jy * 2)]);
  }
  const at = (i, j) => P[j * (nx + 1) + i];
  const kx = br.kdx || 0, ky = br.kdy || -1, power = br.type === 'boss' ? 520 : 300;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = at(i, j), b = at(i + 1, j), c = at(i + 1, j + 1), d = at(i, j + 1);
    for (const tri of (rnd() < 0.5 ? [[a, b, c], [a, c, d]] : [[a, b, d], [b, c, d]])) {
      const gx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, gy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
      const ox = gx - w / 2, oy = gy - h / 2, sp = power * (0.45 + rnd() * 0.75);
      shards.push({
        x: br.X + gx, y: br.Y + gy, pts: tri.map(p => [p[0] - gx, p[1] - gy]),
        vx: ox * 7 + kx * sp + (rnd() - 0.5) * 120, vy: oy * 7 + ky * sp - 140 - rnd() * 160,
        rot: 0, vr: (rnd() - 0.5) * 22, col, shade: rnd() * 0.35 - 0.15, life: 1.1 + rnd() * 0.5, max: 1.6, bounced: 0,
      });
    }
  }
  if (shards.length > 480) shards.splice(0, shards.length - 480);
}
// Neighbours of a broken brick get shoved away from it (they spring back).
function shockwave(cx, cy, rad, force) {
  for (const o of S.bricks) {
    if (o.dead || isItem(o)) continue;
    const dx = o.X + o.Wd / 2 - cx, dy = o.Y + o.Ht / 2 - cy, d = Math.hypot(dx, dy);
    if (d > 0 && d < rad) { const f = force * (1 - d / rad); o.kx = (o.kx || 0) + dx / d * f; o.ky = (o.ky || 0) + dy / d * f; }
  }
}
// Several bricks broken within a quarter second escalate into slow motion and a camera punch.
const MULTI = [
  { n: 4, word: 'BREAK', shake: 6, zoom: 0.02, slow: 0, chroma: 0, hap: 30 },
  { n: 8, word: 'SMASH', shake: 10, zoom: 0.035, slow: 0.28, chroma: 0.35, hap: 60 },
  { n: 14, word: 'DEVASTATION', shake: 14, zoom: 0.05, slow: 0.45, chroma: 0.6, hap: 90 },
  { n: 22, word: 'ANNIHILATION', shake: 16, zoom: 0.07, slow: 0.6, chroma: 0.9, hap: 140 },
];
function countBurst() {
  S.burstN++; S.burstT = 0.28;
  const lv = MULTI.findIndex(m => m.n === S.burstN);
  if (lv < 0) return;
  const m = MULTI[lv];
  shake(m.shake); S.camZ = Math.max(S.camZ, m.zoom); S.camR = (rnd() < 0.5 ? -1 : 1) * m.zoom * 0.5;
  S.chroma = Math.max(S.chroma, m.chroma);
  if (m.slow) { S.slowmo = Math.max(S.slowmo, m.slow); sfx.whoosh(); }
  bigWords.push({ s: `${m.word} x${S.burstN}`, life: 1.1, max: 1.1, y: H * 0.46, size: 15 + lv * 3, style: 'slam' });
  sfx.slam(lv); buzz(m.hap);
  if (lv >= 1) { S.flash = 0.25 + lv * 0.08; S.flashCol = '255,255,255'; }
}
function lineClear(br) {
  const y = br.Y + br.Ht / 2;
  beams.push({ x: 0, y: y - 8, w: W, h: 16, life: 0.3, max: 0.3 });
  for (let x = 20; x < W; x += 40) burst(x, y, TH.accent, 3, 200);
  texts.push(mkText(W / 2, y - 6, 'LINE CLEAR', TH.css.gold, 1.1, 14));
  addGold(3, W / 2, y); shake(5); S.camZ = Math.max(S.camZ, 0.02); sfx.laser(); buzz(40);
}
function perfectClear() {
  S.perfectDone = true;
  bigWords.push({ s: 'PERFECT!', life: 1.8, max: 1.8, y: H * 0.38, size: 30, style: 'slam' });
  S.slowmo = Math.max(S.slowmo, 0.8); S.flash = 0.7; S.flashCol = '255,255,255'; S.chroma = 1; S.camZ = 0.08; shake(14);
  for (let i = 0; i < 8; i++) burst(W * (i + 0.5) / 8, TOP + 120 + rnd() * 300, TH.accent, 24, 420);
  addGold(10 + S.turn, W / 2, H * 0.45); sfx.whoosh(); sfx.slam(3); sfx.clear(); buzz(200);
}

function kill(br) {
  br.dead = true; clearCells(br);
  const cx = br.X + br.Wd / 2, cy = br.Y + br.Ht / 2, boss = br.type === 'boss';
  shatter(br);
  burst(cx, cy, br.col || brickColor(br), boss ? 50 : 5, boss ? 380 : 220);
  pops.push({ x: br.X, y: br.Y, w: br.Wd, h: br.Ht, life: 0.22, max: 0.22 });
  shockwave(cx, cy, CW * (boss ? 4 : 1.7), boss ? 14 : 5);
  countBurst();
  sfx.crunch(S.burstN);
  if (!boss && br.rowSize >= 4 && !S.bricks.some(o => !o.dead && !isItem(o) && o.r === br.r)) lineClear(br);
  if (!S.perfectDone && S.phase === 'fire' && !S.bricks.some(o => !o.dead && !isItem(o))) perfectClear();
  S.combo++; S.kills++; S.comboPulse = 1; S.maxCombo = Math.max(S.maxCombo, S.combo);
  if (S.comboMile < COMBO_MILES.length && S.combo >= COMBO_MILES[S.comboMile]) {
    bigWords.push({ s: TH.words[S.comboMile], life: 1.1, max: 1.1, y: H * 0.3, size: 16 + S.comboMile * 2 });
    S.comboMile++; shake(5); sfx.clear(); buzz(40);
  }
  if (S.combo >= 20 && !S.fever) { S.fever = true; S.flash = 0.35; S.flashCol = '255,255,255'; }
  if (!boss && rnd() < (S.fever ? 0.5 : 0.25)) flyCoin(cx, cy);
  shake(boss ? 14 : 1.2);
  sfx.brk(S.combo); buzz(boss ? 80 : 8);
  const bonus = Math.floor(S.turn / 10);
  if (boss) {
    gainXp(25);
    S.bosses++; S.hitstop = 0.16;
    if (STG.endless) { if (S.bosses % BOSSES_PER_WORLD === 0) S.worldPending = true; }
    else if (S.bosses >= STG.bosses) S.cleared = true; S.flash = 0.6; S.flashCol = '255,255,255';
    addGold(BAL.goldBoss + BAL.goldChapter(br.chapter), cx, cy);
    if (S.cleared) showBanner('STAGE CLEAR', `스테이지 ${STG.id} 돌파!`, TH.css.gold);
    else showBanner(STG.endless ? `CHAPTER ${br.chapter} CLEAR` : `BOSS ${S.bosses}/${STG.bosses}`, '보스 격파!', TH.css.gold);
    sfx.clear();
  } else if (br.type === 'steel') { gainXp(3 + bonus); addGold(2, cx, cy); }
  else { gainXp(1 + bonus); addGold(BAL.goldPerKill); }
  if (br.type === 'bomb') S.blasts.push({ x: cx, y: cy, rad: CW * 1.6, dmg: Math.ceil(S.turn * 1.5) + S.dmg * 2, kind: 'bomb', t: 0.06 });
  if (br.type === 'chest') { S.pendingLevels++; texts.push(mkText(cx, cy, '+LV', TH.css.gold, 1, 14)); sfx.lvl(); }
  if (br.type === 'slime') splitSlime(br);
  if (S.lv.fire > 0) S.blasts.push({ x: cx, y: cy, rad: CW * 1.15, dmg: S.dmg * (1 + S.lv.fire), kind: 'fire', t: 0.07 });
}

// A slime splits into up to two small bricks in free neighbouring cells.
function splitSlime(br) {
  const cand = [[br.r, br.c - 1], [br.r, br.c + 1], [br.r + 1, br.c], [br.r - 1, br.c]]
    .filter(([r, c]) => r >= 0 && r < ROWS - 1 && c >= 0 && c < COLS && !grid[r * COLS + c]);
  let n = 0;
  for (const [r, c] of cand) {
    if (n >= 2) break;
    const X = c * CW + 2, Y = TOP + r * RH + 2;
    if (S.movers.some(b => b.x + b.r > X && b.x - b.r < X + CW - 4 && b.y + b.r > Y && b.y - b.r < Y + RH - 4)) continue;
    const kid = addBrick({ c, r, span: 1, type: 'n', hp: Math.max(1, Math.ceil(br.maxHp / 3)) }, false);
    kid.flash = 1; n++;
  }
  if (n) { sfx.slime(); burst(br.X + br.Wd / 2, br.Y + br.Ht / 2, '#7dffb0', 10, 160); }
}

function processBlasts(dt) {
  if (!S.blasts.length) return;
  for (const b of S.blasts) b.t -= dt;
  const due = S.blasts.filter(b => b.t <= 0);
  S.blasts = S.blasts.filter(b => b.t > 0);
  for (const b of due) {
    const col = b.kind === 'bomb' ? TH.css.hot : '#ff8a3d';
    rings.push({ x: b.x, y: b.y, r: b.rad, life: 0.3, max: 0.3, col });
    burst(b.x, b.y, col, b.kind === 'bomb' ? 22 : 8, 260);
    if (b.kind === 'bomb') { shake(7); sfx.boom(); buzz(30); S.hitstop = Math.max(S.hitstop, 0.04); } else shake(1.2);
    for (const br of S.bricks) {
      if (br.dead || isItem(br)) continue;
      const dx = Math.max(br.X - b.x, 0, b.x - (br.X + br.Wd)), dy = Math.max(br.Y - b.y, 0, b.y - (br.Y + br.Ht));
      if (dx * dx + dy * dy <= (b.rad * 0.55) ** 2) {
        const ux = br.X + br.Wd / 2 - b.x, uy = br.Y + br.Ht / 2 - b.y, ul = Math.hypot(ux, uy) || 1;
        br.kdx = ux / ul; br.kdy = uy / ul;
        dealDamage(br, b.dmg, false);
      }
    }
  }
}

function zap(from) {
  const fx = from.X + from.Wd / 2, fy = from.Y + from.Ht / 2;
  const cand = S.bricks.filter(b => !b.dead && b !== from && !isItem(b))
    .map(b => ({ b, d: (b.X + b.Wd / 2 - fx) ** 2 + (b.Y + b.Ht / 2 - fy) ** 2 }))
    .sort((a, b) => a.d - b.d).slice(0, S.lv.chain + 1);
  let px = fx, py = fy;
  for (const { b } of cand) {
    const tx = b.X + b.Wd / 2, ty = b.Y + b.Ht / 2, pts = [[px, py]];
    for (let i = 1; i < 6; i++) pts.push([px + (tx - px) * i / 6 + (rnd() - 0.5) * 16, py + (ty - py) * i / 6 + (rnd() - 0.5) * 16]);
    pts.push([tx, ty]);
    bolts.push({ pts, life: 0.16, max: 0.16 });
    dealDamage(b, S.dmg * 2, false);
    px = tx; py = ty;
  }
  if (cand.length) sfx.zap();
}

// Acid: stacks left by hits all burst at the end of the turn, then halve.
function acidTick() {
  let any = false;
  for (const br of S.bricks) {
    if (br.dead || isItem(br) || !br.acid) continue;
    const d = br.acid * S.dmg * 0.5;
    texts.push(mkText(br.X + br.Wd / 2, br.Y + 4, fmtDmg(Math.round(d * 10) / 10), UPG.acid.col, 0.8, 9));
    burst(br.X + br.Wd / 2, br.Y + br.Ht / 2, UPG.acid.col, 4, 120);
    br.acid = Math.floor(br.acid / 2);
    dealDamage(br, d, false);
    any = true;
  }
  if (any) { sfx.slime(); shake(2); }
  return any;
}

// Laser items fire once per ball that passes through them.
function fireLaser(item) {
  item.flash = 1;
  if (item.type === 'lzh') {
    beams.push({ x: 0, y: item.Y + item.Ht / 2 - 5, w: W, h: 10, life: 0.18, max: 0.18 });
    for (const br of S.bricks) if (!br.dead && !isItem(br) && br.r === item.r) dealDamage(br, S.dmg, false);
  } else {
    beams.push({ x: item.X + item.Wd / 2 - 5, y: TOP, w: 10, h: FB - TOP, life: 0.18, max: 0.18 });
    for (const br of S.bricks) if (!br.dead && !isItem(br) && br.c <= item.c && item.c < br.c + br.span) dealDamage(br, S.dmg, false);
  }
  sfx.laser();
}

function hitBrick(br, b) {
  let d = S.dmg, crit = false;
  // knockback and shards push the brick away from the ball
  const ux = br.X + br.Wd / 2 - b.x, uy = br.Y + br.Ht / 2 - b.y, ul = Math.hypot(ux, uy) || 1;
  br.kdx = ux / ul; br.kdy = uy / ul;
  if (parts.length < 600) for (let i = 0; i < 2; i++) {
    const a = Math.atan2(b.vy, b.vx) + (rnd() - 0.5) * 1.2, v = 260 + rnd() * 220;
    parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.18, max: 0.22, size: 2.4, col: '#ffffff', kind: 'spark', rot: 0, vr: 0, g: 0 });
  }
  if (b.iron) d *= S.lv.iron + 2;
  if (S.lv.rush) {
    d *= 1 + b.rush * 0.12 * S.lv.rush;
    b.rush = Math.min(20, b.rush + 1);
    if (Math.hypot(b.vx, b.vy) < BAL.ballSpeed * 1.6) { b.vx *= 1.03; b.vy *= 1.03; }
  }
  if (S.lv.acid && !isItem(br)) br.acid = (br.acid || 0) + S.lv.acid;
  if (S.crit && rnd() < S.crit) { d *= 3; crit = true; }
  if (br.type === 'steel') sfx.steel(); else sfx.hit();
  dealDamage(br, d, crit);
  S.hits++;
  if (S.lv.chain > 0 && S.hits % zapEvery(S.lv.chain) === 0) zap(br);
  if (S.lv.split > 0 && !b.temp && !b.split) {
    b.split = true;
    const sp = Math.hypot(b.vx, b.vy);
    for (let k = 1; k <= S.lv.split; k++) {
      const a = Math.atan2(b.vy, b.vx) + (k % 2 ? 1 : -1) * 0.32 * Math.ceil(k / 2);
      let vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
      if (Math.abs(vy) < sp * 0.14) { vy = Math.sign(vy || -1) * sp * 0.14; vx = Math.sign(vx || 1) * Math.sqrt(sp * sp - vy * vy); }
      S.movers.push(mkBall(b.x, b.y, vx, vy, true));
    }
  }
}

// ---- 60-physics.js ----
// Ball movement. The ball collides as a square (AABB) against bricks, one axis at a time,
// in sub-steps shorter than its radius so it never tunnels through a brick.
function mkBall(x, y, vx, vy, temp) {
  return { x, y, vx, vy, r: ballR(), alive: true, temp, split: false, ghost: new Set(), touched: new Set(), trail: [], rush: 0, fb: 0, iron: false };
}
function overlaps(b, br) { return b.x + b.r > br.X && b.x - b.r < br.X + br.Wd && b.y + b.r > br.Y && b.y - b.r < br.Y + br.Ht; }

function touchItem(b, br, r, c) {
  const dx = b.x - (br.X + br.Wd / 2), dy = b.y - (br.Y + br.Ht / 2);
  if (dx * dx + dy * dy >= (b.r + 10) ** 2) return;
  if (br.type === 'orb') {
    br.dead = true; grid[r * COLS + c] = null; S.orbsGot++;
    texts.push(mkText(br.X + br.Wd / 2, br.Y + 6, '+1', TH.accent, 0.8, 11));
    rings.push({ x: br.X + br.Wd / 2, y: br.Y + br.Ht / 2, r: 30, life: 0.25, max: 0.25, col: TH.accent });
    sfx.orb();
  } else if (!b.touched.has(br)) {
    b.touched.add(br); fireLaser(br);
  }
}

function collide(b, axis) {
  const c0 = Math.max(0, Math.floor((b.x - b.r) / CW)), c1 = Math.min(COLS - 1, Math.floor((b.x + b.r) / CW));
  const r0 = Math.max(0, Math.floor((b.y - b.r - TOP) / RH)), r1 = Math.min(ROWS - 1, Math.floor((b.y + b.r - TOP) / RH));
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const br = grid[r * COLS + c];
    if (!br || br.dead) continue;
    if (isItem(br)) { touchItem(b, br, r, c); continue; }
    if (b.ghost.has(br) || !overlaps(b, br)) continue;
    if (b.iron) { b.ghost.add(br); hitBrick(br, b); continue; } // iron ball ploughs through
    if (S.pierce && rnd() < S.pierce) { b.ghost.add(br); hitBrick(br, b); continue; }
    // Push out on the side the ball's centre is on (not by velocity sign), and never
    // through a wall: a ball squeezed between a brick and the wall bounces vertically.
    let nx = null;
    if (axis === 0) {
      const left = b.x < br.X + br.Wd / 2;
      nx = left ? br.X - b.r - 0.01 : br.X + br.Wd + b.r + 0.01;
      if (nx >= b.r && nx <= W - b.r) { b.x = nx; b.vx = left ? -Math.abs(b.vx) : Math.abs(b.vx); }
      else nx = null;
    }
    if (nx === null) {
      const up = b.y < br.Y + br.Ht / 2;
      b.y = up ? br.Y - b.r - 0.01 : br.Y + br.Ht + b.r + 0.01;
      b.vy = up ? -Math.abs(b.vy) : Math.abs(b.vy);
    }
    hitBrick(br, b);
    return;
  }
}

function moveBall(b, dt) {
  const sp = Math.hypot(b.vx, b.vy);
  const n = Math.max(1, Math.ceil(sp * dt / (b.r * 0.9)));
  for (let i = 0; i < n && b.alive; i++) {
    b.x += b.vx * dt / n;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); sfx.wall(); }
    else if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); sfx.wall(); }
    collide(b, 0);
    b.y += b.vy * dt / n;
    if (b.y < TOP + b.r) { b.y = TOP + b.r; b.vy = Math.abs(b.vy); sfx.wall(); }
    collide(b, 1);
    if (b.ghost.size) for (const g of b.ghost) if (g.dead || !overlaps(b, g)) b.ghost.delete(g);
    if (b.vy > 0 && b.y >= LY && b.fb < S.lv.bounce) {
      // bounce pad: send the ball back up
      b.fb++; b.y = LY - 0.5; b.vy = -Math.abs(b.vy);
      rings.push({ x: b.x, y: LY, r: 26, life: 0.22, max: 0.22, col: UPG.bounce.col }); sfx.wall();
    } else if (b.vy > 0 && b.y >= LY) {
      b.alive = false;
      if (!b.temp) {
        if (S.nextLaunchX === null) S.nextLaunchX = clamp(b.x, 12, W - 12);
        homers.push({ x: b.x });
      }
    }
  }
  b.trail.push(b.x, b.y);
  if (b.trail.length > 10) b.trail.splice(0, 2);
}

// Aim guide: trace the shot through its first bounce, using the same collision rules.
function hitTest(x, y, r) {
  const c0 = Math.max(0, Math.floor((x - r) / CW)), c1 = Math.min(COLS - 1, Math.floor((x + r) / CW));
  const r0 = Math.max(0, Math.floor((y - r - TOP) / RH)), r1 = Math.min(ROWS - 1, Math.floor((y + r - TOP) / RH));
  for (let rr = r0; rr <= r1; rr++) for (let c = c0; c <= c1; c++) {
    const br = grid[rr * COLS + c];
    if (br && !br.dead && !isItem(br) && x + r > br.X && x - r < br.X + br.Wd && y + r > br.Y && y - r < br.Y + br.Ht) return true;

}
function aimPath() {
  const r = ballR(), st = 4;
  let x = S.launchX, y = LY, dx = S.aim.x * st, dy = S.aim.y * st;
  const pre = [], post = []; let hit = null, after = 0;
  for (let i = 0; i < 600; i++) {
    let bounced = false;
    x += dx;
    if (x < r || x > W - r || hitTest(x, y, r)) { x -= dx; dx = -dx; bounced = true; }
    y += dy;
    if (y < TOP + r || hitTest(x, y, r)) { y -= dy; dy = -dy; bounced = true; }
    if (bounced && hit) break;
    if (bounced) hit = { x, y };
    if (!hit) { if (i % 4 === 3) pre.push(x, y); }
    else { after += st; if (i % 4 === 3) post.push(x, y); if (after > 120) break; }

  return { pre, post, hit };
}

// ---------- per-frame update ----------

  const slow = S.slowmo > 0 ? 0.28 : 1;
  S.slowmo = Math.max(0, S.slowmo - dt);

  if (slow < 1) { updateWorld(dt * slow); updateFx(dt * 0.45); return; }
  updateWorld(dt);
  updateFx(dt);
}

}

    if (S.turnTime > 1.5 && recallEl.hidden) recallEl.hidden = false;
    if (S.turnTime > 45 && S.movers.length) recall(); // safety: no turn runs forever (e.g. endless bounce loops)

    if (S.burstT > 0) { S.burstT -= gdt; if (S.burstT <= 0) S.burstN = 0; }

        if (S.ironLeft > 0) { S.ironLeft--; b.iron = true; b.r = IRON_R; }
        S.movers.push(b);
        S.toFire--; S.fireTimer += BAL.fireGap; sfx.shoot();

    S.movers = S.movers.filter(b => b.alive);
    processBlasts(gdt);

      // end of a volley: maybe encore, then acid settles, then the turn ends
      if (!S.encoreChecked && (S.encoreChecked = true) && S.lv.encore && rnd() < 0.15 * S.lv.encore) encore();
      else if (S.lv.acid && !S.acidDone) { S.acidDone = true; acidTick(); }

    const k2 = 1 - bw.life / bw.max, sc = k2 < 0.1 ? 3 - k2 * 20 : 1 + Math.max(0, 0.15 - (k2 - 0.1)) ;
    ctx.restore(); ctx.save(); ctx.globalAlpha = Math.min(1, bw.life / (bw.max * 0.25));
    ctx.translate(W / 2 + (k2 < 0.3 ? (rnd() - 0.5) * 6 : 0), bw.y); ctx.rotate(-0.06); ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.font = DISP(bw.size); ctx.fillText(bw.s, 4, 5);
    outlined(bw.s, 0, 0, TH.css.gold, bw.size);
    ctx.restore(); return;
  }
  if (style === 'burst') {
    ctx.rotate(-0.08);
    ctx.beginPath();
    for (let i = 0; i < 24; i++) { const r = i % 2 ? 58 : 92, an = i / 24 * Math.PI * 2 + now / 900; ctx.lineTo(Math.cos(an) * r * 1.5, Math.sin(an) * r * 0.75); }
    ctx.closePath(); ctx.fillStyle = '#ffd400'; ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.stroke();
  } else if (style === 'rays') {
    ctx.save(); ctx.rotate(now / 700); ctx.fillStyle = 'rgba(255,213,74,.22)';
    for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-24, -220); ctx.lineTo(24, -220); ctx.fill(); }
    ctx.restore();
  } else if (style === 'bubble') {
    ctx.font = DISP(size); const tw = ctx.measureText(bw.s).width;
    rr(-tw / 2 - 18, -size * TH.dsz * 0.75, tw + 36, size * TH.dsz * 1.5, size * TH.dsz * 0.75);
    ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.strokeStyle = TH.accent; ctx.lineWidth = 4; ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (style === 'chrome' || style === 'rays') {
    ctx.font = DISP(size); ctx.lineJoin = 'round';
    const g = ctx.createLinearGradient(0, -size, 0, size);
    if (style === 'chrome') { g.addColorStop(0, '#39f3ff'); g.addColorStop(0.48, '#ffffff'); g.addColorStop(0.52, '#ff3ea5'); g.addColorStop(1, '#ffe14d'); }
    else { g.addColorStop(0, '#fff6b0'); g.addColorStop(0.5, '#ffd54a'); g.addColorStop(1, '#c47a00'); }
    ctx.lineWidth = size / 2; ctx.strokeStyle = TH.outline; ctx.strokeText(bw.s, 0, 0);
    ctx.fillStyle = g; ctx.fillText(bw.s, 0, 0);
  } else if (style === 'burst') {
    outlined(bw.s, 0, 0, '#ff2a3d', size);
  } else if (style === 'bubble') {
    ctx.font = DISP(size); ctx.fillStyle = TH.accent; ctx.fillText(bw.s, 0, 0);
  } else if (style === 'clean') {
    ctx.font = DISP(size); const tw = ctx.measureText(bw.s).width;
    const g = ctx.createLinearGradient(-tw / 2, 0, tw / 2, 0);
    g.addColorStop(0, bw.col || TH.accent); g.addColorStop(0.5, TH.light ? (TH.ball.temp || '#9d8cff') : '#ffffff'); g.addColorStop(1, bw.col || (TH.light ? TH.accent : '#9d8cff'));
    ctx.shadowColor = bw.col || TH.accent; ctx.shadowBlur = 18;
    ctx.fillStyle = g; ctx.fillText(bw.s, 0, 0); ctx.shadowBlur = 0;
    const lw = tw * Math.min(1, k * 4);
    ctx.fillStyle = g; ctx.fillRect(-lw / 2, size * TH.dsz * 0.62, lw, 2);
  } else {
    const hue = (now / 4) % 360;
    outlined(bw.s, 0, 0, bw.col || `hsl(${hue},100%,65%)`, size);
  }
  ctx.restore();
}

function drawAim() {
  const { pre, post, hit } = aimPath(), r = ballR();
  ctx.fillStyle = TH.light ? TH.hud.ink : '#ffffff';
  for (let i = 0; i < pre.length; i += 2) { ctx.globalAlpha = 0.95 - (i / pre.length) * 0.45; ctx.beginPath(); ctx.arc(pre[i], pre[i + 1], 2.4, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = TH.accent;
  for (let i = 0; i < post.length; i += 2) { ctx.globalAlpha = 0.8 * (1 - i / post.length); ctx.beginPath(); ctx.arc(post[i], post[i + 1], 1.8, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (hit) { ctx.strokeStyle = TH.light ? TH.hud.ink : '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hit.x, hit.y, r, 0, Math.PI * 2); ctx.stroke(); }
}

function drawBalls(now) {
  const r = ballR(), bc = ballColor(), gl = glow(TH.ball.glow), glT = glow(TH.ball.temp);
  const fever = S.fever;
  ctx.globalCompositeOperation = TH.light ? 'source-over' : 'lighter';
  for (const b of S.movers) {
    const t = b.trail;
    for (let i = 0; i < t.length; i += 2) {
      ctx.globalAlpha = (TH.light ? 0.05 : 0.07) + 0.05 * i; const s = b.r * (1.4 + i * 0.12);
      const g = fever ? glow(RAINBOW[Math.floor(now / 60 + i + b.x / 40) % RAINBOW.length]) : b.temp ? glT : b.iron ? glow('#b8c2d9') : b.rush >= 4 ? glow('#ff6a3d') : gl;
      ctx.drawImage(g, t[i] - s, t[i + 1] - s, s * 2, s * 2);
    }
    ctx.globalAlpha = TH.light ? 0.55 : 0.9; ctx.drawImage(b.temp ? glT : b.rush >= 4 ? glow('#ff6a3d') : gl, b.x - b.r * 2.6, b.y - b.r * 2.6, b.r * 5.2, b.r * 5.2);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const outline = TH.brick === 'comic' || TH.light;
  ctx.fillStyle = bc; ctx.beginPath();
  for (const b of S.movers) if (!b.temp && !b.iron) { ctx.moveTo(b.x + b.r, b.y); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); }
  for (const h of homers) { ctx.moveTo(h.x + r * 0.7, LY); ctx.arc(h.x, LY, r * 0.7, 0, Math.PI * 2); }
  ctx.fill(); if (outline) { ctx.strokeStyle = TH.outline === '#ffffff' ? TH.hud.ink : TH.outline; ctx.lineWidth = 1.6; ctx.stroke(); }
  ctx.fillStyle = TH.ball.temp; ctx.beginPath();
  for (const b of S.movers) if (b.temp) { ctx.moveTo(b.x + b.r, b.y); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); }
  ctx.fill(); if (outline) ctx.stroke();
  // iron balls: heavy steel spheres
  for (const b of S.movers) if (b.iron) {
    const g = ctx.createRadialGradient(b.x - b.r * 0.4, b.y - b.r * 0.4, 1, b.x, b.y, b.r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#c9d1e3'); g.addColorStop(1, '#4b5368');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2a2f3d'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

function drawHud(now, ch) {
  const hd = TH.hud;
  ctx.fillStyle = hd.bg; ctx.fillRect(0, 0, W, TOP - 4);
  ctx.fillStyle = hd.line; ctx.fillRect(0, TOP - 4, W, 4);
  if (TH === THEMES.jackpot) {
    const on = Math.floor(now / 140) % 3;
    for (let x = 6, i = 0; x < W; x += 14, i++) { ctx.fillStyle = (i % 3) === on ? '#fff3b0' : '#7a5c0a'; ctx.beginPath(); ctx.arc(x, TOP - 2, 2, 0, Math.PI * 2); ctx.fill(); }
  } else if (TH === THEMES.synth) {
    ctx.drawImage(glow('#ff3ea5'), 0, TOP - 14, W, 24);
  }
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left'; ctx.fillStyle = hd.dim; ctx.font = DISP(8); ctx.fillText('TURN', 16, 22);
  ctx.fillStyle = hd.ink; ctx.font = DISP(18); ctx.fillText(String(S.turn), 16, 48);
  ctx.textAlign = 'right'; ctx.fillStyle = hd.dim; ctx.font = DISP(8); ctx.fillText('LEVEL', W - 16, 22);
  ctx.fillStyle = hd.accent; ctx.font = DISP(18); ctx.fillText(String(S.level), W - 16, 48);
  // one life: a single heart that beats faster as bricks close in
  {
    const bp = 1 + (S.beatPulse || 0) * 0.35;
    ctx.save(); ctx.translate(W / 2, 27); ctx.scale(1.3 * bp, 1.3 * bp); heart(-7.5, -6, true); ctx.restore();
    if (S.shield > 0) {
      const x = W / 2 + 22, y = 22;
      ctx.fillStyle = SHIELD_COL;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 10, y + 2.5); ctx.lineTo(x + 10, y + 9); ctx.lineTo(x + 5, y + 15); ctx.lineTo(x, y + 9); ctx.lineTo(x, y + 2.5); ctx.closePath(); ctx.fill();
    }
  }
  ctx.textAlign = 'center'; ctx.font = DISP(7);
  ctx.fillStyle = hd.ch; ctx.fillText(STG.endless ? `CH${ch}` : STG.id, W / 2 - 78, 15);
  // boss progress toward the next world: one diamond per boss in this world
  // stage mode: bosses killed of the stage goal; endless: progress toward the next world
  const pipN = STG.endless ? BOSSES_PER_WORLD : STG.bosses, pipOn = STG.endless ? S.bosses % BOSSES_PER_WORLD : S.bosses;
  ctx.textAlign = 'left'; ctx.fillStyle = hd.dim; ctx.font = DISP(5); ctx.fillText(STG.endless ? `W${S.world + 1}` : 'BOSS', 16, 72); ctx.textAlign = 'center';
  for (let i = 0; i < pipN; i++) {
    const x = 46 + i * 10, y = 69, on = i < pipOn;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = on ? hd.accent : hd.xpBg; ctx.fillRect(-2.6, -2.6, 5.2, 5.2); ctx.restore();
  }
  ctx.fillStyle = hd.dim; ctx.fillText(`DMG ${fmtDmg(Math.round(S.dmg * 10) / 10)}  BALL ${S.balls}`, W / 2 + 10, 15);
  const gs = 1 + S.goldBump * 0.5;
  ctx.save(); ctx.translate(W / 2, 50); ctx.scale(gs, gs); ctx.fillStyle = hd.accent; ctx.font = DISP(8); ctx.fillText(`${Math.floor(S.gold)}G`, 0, 0); ctx.restore();
  ctx.fillStyle = hd.xpBg; ctx.fillRect(16, 58, W - 32, 6);
  ctx.fillStyle = S.xpFlash > 0 ? '#ffffff' : hd.xp; ctx.fillRect(16, 58, (W - 32) * clamp(S.xp / S.xpNeed, 0, 1), 6);
}

function draw(now) {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.fillStyle = TH.css.bg; ctx.fillRect(0, 0, W, H);
  const sx = S.shake ? (rnd() - 0.5) * 2 * S.shake : 0, sy = S.shake ? (rnd() - 0.5) * 2 * S.shake : 0;
  const ch = chapterOf(S.turn);
  ctx.save(); ctx.translate(sx, sy);
  if (S.camZ > 0.001) { // camera punch on big breaks
    ctx.translate(W / 2, H * 0.45); ctx.scale(1 + S.camZ, 1 + S.camZ); ctx.rotate(S.camR); ctx.translate(-W / 2, -H * 0.45);
  }

  TH.field(ctx, now, ch);
  ctx.strokeStyle = TH.line2; ctx.globalAlpha = 0.7; ctx.setLineDash([8, 6]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, FB + 1); ctx.lineTo(W, FB + 1); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  if (S.shield > 0) { // shield barrier on the red line
    ctx.globalAlpha = 0.55 + 0.25 * Math.sin(now / 200);
    ctx.drawImage(glow(SHIELD_COL), -40, FB - 12, W + 80, 26);
    ctx.fillStyle = SHIELD_COL; ctx.fillRect(0, FB, W, 2); ctx.globalAlpha = 1;
  }
  if (S.lv.bounce) { // bounce pad along the launcher line
    ctx.globalAlpha = 0.5; ctx.drawImage(glow(UPG.bounce.col), -40, LY + 1, W + 80, 18); ctx.globalAlpha = 1;
    ctx.fillStyle = UPG.bounce.col; ctx.fillRect(0, LY + ballR() + 2, W, 2);
  }

  ctx.save(); ctx.beginPath(); ctx.rect(0, TOP, W, H - TOP); ctx.clip();
  for (const br of S.bricks) if (!br.dead) drawBrick(br, now);
  ctx.restore();

  // laser beams
  ctx.globalCompositeOperation = TH.light ? 'source-over' : 'lighter';
  for (const b of beams) {
    const k = b.life / b.max;
    ctx.globalAlpha = k; ctx.fillStyle = TH.css.gold; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#ffffff';
    if (b.w > b.h) ctx.fillRect(b.x, b.y + b.h / 2 - 1.5, b.w, 3); else ctx.fillRect(b.x + b.w / 2 - 1.5, b.y, 3, b.h);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  // break pops: a quick expanding outline where a brick died
  for (const p of pops) {
    const k = 1 - p.life / p.max, e = 6 + k * 14;
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = TH.light ? TH.hud.ink : '#ffffff'; ctx.lineWidth = 3 * (1 - k) + 1;
    ctx.strokeRect(p.x - e, p.y - e, p.w + e * 2, p.h + e * 2);
  }
  ctx.globalAlpha = 1;

  drawShards();
  if (S.phase === 'aim' && S.aiming && S.aimOk) drawAim();
  drawBalls(now);

  // launcher
  const r = ballR(), bc = ballColor();
  ctx.strokeStyle = TH.hud.line; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, LY + r + 1); ctx.lineTo(W, LY + r + 1); ctx.stroke();
  if (S.phase !== 'fire' || S.toFire > 0) {
    const kick = 1 + S.kick * 0.5;
    ctx.drawImage(glow(TH.ball.glow), S.launchX - r * 3 * kick, LY - r * 3 * kick, r * 6 * kick, r * 6 * kick);
    ctx.fillStyle = bc; ctx.beginPath(); ctx.arc(S.launchX, LY, r * kick, 0, Math.PI * 2); ctx.fill();
    if (TH.light) { ctx.strokeStyle = TH.hud.ink; ctx.lineWidth = 1.6; ctx.stroke(); }
  }
  if (S.nextLaunchX !== null) { ctx.strokeStyle = TH.accent; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(S.nextLaunchX, LY, r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cnt = S.phase === 'fire' ? S.toFire : S.balls;
  if (cnt > 0) outlined('x' + cnt, clamp(S.launchX, 30, W - 30), LY + 26, TH.css.ink, 10);
  if (S.orbsGot) outlined('+' + S.orbsGot, clamp(S.nextLaunchX ?? S.launchX, 30, W - 30), LY + 42, TH.accent, 8);

  drawParticles();
  for (const g of rings) {
    const t = 1 - g.life / g.max;
    ctx.globalAlpha = 1 - t; ctx.strokeStyle = g.col; ctx.lineWidth = 5 * (1 - t) + 1;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r * (0.35 + 0.65 * t), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.18 * (1 - t); ctx.fillStyle = g.col; ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const b of bolts) {
    ctx.globalAlpha = b.life / b.max;
    for (const [col, lw] of [[TH.accent, 5], ['#ffffff', 2]]) {
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
      b.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const k = 1 - t.life / t.max, s = 1 + 0.5 * Math.max(0, 1 - k * 7);
    ctx.globalAlpha = Math.min(1, t.life / (t.max * 0.35));
    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(s, s); outlined(t.s, 0, 0, t.col, t.size); ctx.restore();
  }
  ctx.globalAlpha = 1;
  if (S.phase === 'fire' && S.combo >= 5) {
    const s = 1 + S.comboPulse * 0.4, size = Math.min(22, 11 + S.combo * 0.2);
    const col = S.combo >= 20 ? `hsl(${(now / 3) % 360},100%,62%)` : S.combo >= 15 ? TH.css.gold : TH.accent;
    ctx.save(); ctx.translate(W / 2, TOP + 52); ctx.scale(s, s);
    outlined('COMBO ' + S.combo, 0, 0, col, size);
    ctx.restore();
  }
  for (const bw of bigWords) drawBigWord(bw, now);
  ctx.restore(); // end shake

  // impact ghosting: two offset copies of the frame right after a big break
  if (S.chroma > 0.02) {
    const off = S.chroma * 7 * dpr * scale;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = TH.light ? 'multiply' : 'lighter'; ctx.globalAlpha = S.chroma * 0.28;
    ctx.drawImage(cv, off, 0); ctx.drawImage(cv, -off, 0);
    ctx.restore();
  }
  // danger: red pulse from the bottom when bricks approach the red line
  if (S.danger > 0 && (S.phase === 'aim' || S.phase === 'fire')) {
    const a = S.danger * (0.18 + 0.22 * (S.beatPulse || 0));
    const g = ctx.createLinearGradient(0, FB - 220, 0, FB + 10);
    g.addColorStop(0, 'rgba(255,40,70,0)'); g.addColorStop(1, `rgba(255,40,70,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, FB - 220, W, 230);
    if (S.danger >= 0.5 && Math.floor(now / 350) % 2 === 0) { ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; outlined('DANGER', W / 2, FB - 16, '#ff2846', 10); }
  }
  // coins flying to the HUD gold counter
  for (const c of flyers) {
    const k = clamp(c.t / c.dur, 0, 1), e = k * k, x = (1 - e) * ((1 - k) * c.sx + k * c.cx) + e * W / 2, y = (1 - e) * ((1 - k) * c.sy + k * c.cy) + e * 50;
    ctx.drawImage(glow(TH.css.gold), x - 9, y - 9, 18, 18);
    ctx.beginPath(); ctx.ellipse(x, y, 4.5 * Math.abs(Math.cos(c.t * 14)) + 0.8, 4.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd54a'; ctx.fill(); ctx.strokeStyle = '#a8740a'; ctx.lineWidth = 1; ctx.stroke();
  }

  // fever frame
  if (S.fever) {
    const a = 0.45 + 0.35 * Math.sin(now / 90);
    ctx.strokeStyle = `hsla(${(now / 3) % 360},100%,60%,${a})`; ctx.lineWidth = 8; ctx.strokeRect(4, TOP + 4, W - 8, LY - TOP - 4);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    outlined('FEVER!', W / 2, TOP + 84, TH.fever, 10);
  }

  // banner
  if (S.banner) {
    const b = S.banner, k = b.life / b.max, a = Math.min(1, k * 4, (1 - k) * 8);
    ctx.globalAlpha = a;
    ctx.fillStyle = TH.css.ov; ctx.fillRect(0, H * 0.4 - 46, W, 92);
    ctx.fillStyle = b.col; ctx.fillRect(0, H * 0.4 - 46, W, 4); ctx.fillRect(0, H * 0.4 + 42, W, 4);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    outlined(b.title, W / 2, H * 0.4 - 12, b.col, 18);
    ctx.font = KO(22); ctx.fillStyle = TH.css.ink; ctx.fillText(b.sub, W / 2, H * 0.4 + 20);
    ctx.globalAlpha = 1;
  }

  // world change: a bright iris opening from the centre
  if (S.wipe > 0) {
    const k = 1 - S.wipe;
    ctx.save(); ctx.globalAlpha = S.wipe;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(W / 2, H * 0.45, k * 700, 0, Math.PI * 2, true); ctx.fill('evenodd');
    ctx.strokeStyle = TH.accent; ctx.lineWidth = 10 * S.wipe; ctx.beginPath(); ctx.arc(W / 2, H * 0.45, k * 700, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  drawHud(now, ch);

  if (S.phase === 'fire' && S.timeScale > 1) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    outlined('FAST x' + S.timeScale, W / 2, H - 22, TH.accent, 9);
  } else if (S.phase === 'aim' && !S.aiming) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.globalAlpha = 0.55 + 0.45 * Math.sin(now / 300);
    outlined('HOLD & AIM', W / 2, H - 22, TH.css.dim, 8); ctx.globalAlpha = 1;
  }
  if (S.flash > 0) { ctx.fillStyle = `rgba(${S.flashCol},${S.flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
}

// ---- 90-main.js ----
// Screen fit, input, buttons and the main loop.
let scale = 1, dpr = 1;
function resize() {
  scale = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  stage.style.width = W * scale + 'px'; stage.style.height = H * scale + 'px';
  stage.style.setProperty('--s', scale);
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize);
resize();

// Aim by pointing where the shot should go; drag below the launcher line to cancel.
function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
function setAim(e) {
  const p = toLocal(e);
  if (p.y > LY - 8) { S.aimOk = false; return; }
  let dx = p.x - S.launchX, dy = p.y - LY;
  const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
  const minDy = -0.14;
  if (dy > minDy) { dy = minDy; dx = Math.sign(dx || 1) * Math.sqrt(1 - dy * dy); }
  S.aim = { x: dx, y: dy }; S.aimOk = true;
}
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  if (S.phase !== 'aim') return;
  S.aiming = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  setAim(e);
});
cv.addEventListener('pointermove', e => { if (S.aiming) setAim(e); });
cv.addEventListener('pointerup', () => { if (S.aiming) { S.aiming = false; if (S.aimOk && S.phase === 'aim') fire(); } });
cv.addEventListener('pointercancel', () => { S.aiming = false; });

sndEl.onclick = () => { muted = !muted; sndEl.textContent = muted ? 'SND OFF' : 'SND ON'; ensureAudio(); };
recallEl.onclick = recall;
$('start').onclick = () => startStage(nextStageIndex());
$('again').onclick = againOrNext;
$('endless').onclick = startEndless;
$('titleMap').onclick = () => openMap(titleEl);
$('overMap').onclick = () => openMap(overEl);
$('mapClose').onclick = closeMap;

$('titleShop').onclick = () => openShop(titleEl);
$('overShop').onclick = () => openShop(overEl);
$('shopClose').onclick = closeShop;
$('shieldTake').onclick = takeShield; // ad placeholder: a rewarded ad would play here
$('shieldSkip').onclick = hideShieldOffer;
$('claim').onclick = () => claim(1);
$('claim2x').onclick = () => claim(2); // ad placeholder

// ---------- boot ----------
loadSave();
STG = STAGES[nextStageIndex()];
applyTheme(STG.world);
newRun(); S.phase = 'title';
refreshTitle();
// Design-draft links: #glass, #clay, #flat restyle the whole game; #clay-blossom previews one world.
function previewFromHash() {
  const id = location.hash.slice(1);
  if (DIRECTIONS[id]) PREVIEW_DIR = id;
  else if (themeFor(id) && id.includes('-')) PREVIEW_DIR = id.split('-')[0];
  else if (!id) PREVIEW_DIR = null;
  if (S.phase === 'title') { refreshTitle(); if (themeFor(id) && id.includes('-')) applyTheme(id); }
  else applyTheme(STG.world);
}
addEventListener('hashchange', previewFromHash);
previewFromHash();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Debug and balance-simulation hook (used by the headless balance bot).
window.__bm = {
  get state() { return S; },
  get save() { return SAVE; },
  BAL,
  tick(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); },
  shoot(angle) { if (S.phase !== 'aim') return; S.aim = { x: Math.cos(angle), y: Math.sin(angle) }; fire(); },
  pick(i) { if (S.phase === 'levelup' && curChoices[i]) choose(curChoices[i]); },
  newRun(meta, stage) { if (meta) Object.assign(SAVE.meta, meta); STG = stage === undefined ? STG : stage < 0 ? ENDLESS : STAGES[stage]; newRun(); if (S.pendingLevels > 0) showLevel(); },
  theme(id) { applyTheme(id); },
  STAGES,
  word(i) { bigWords.push({ s: TH.words[i], life: 0.85, max: 1.1, y: H * 0.3, size: 16 + i * 2 }); },
  draw(now = performance.now()) { draw(now); },
};

})();
</script>
