<title>Brickmaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout: one portrait arcade screen (420x780 logical), letterboxed and scaled to fit the phone.
   Each visual theme sets these tokens from JS (applyTheme); the values here are the neon theme. */
:root{color-scheme:dark}
#stage{
  --bg:#0a0c1c; --panel:#141939; --line:#2a3270; --ink:#eef0ff; --dim:#8c93c9;
  --gold:#ffd23f; --hot:#ff4f7b; --cool:#3ee6ff; --ov:rgba(10,12,28,.86); --btnInk:#0a0c1c; --logo2:#3ee6ff;
  --disp:"Press Start 2P", ui-monospace, monospace; --dsz:1;
  --ko:"Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#0a0c1c;overflow:hidden;overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);display:flex;align-items:center;justify-content:center}
#stage{position:relative;--s:1;touch-action:none;overflow:hidden;color:var(--ink);font-family:var(--ko);background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.btn{font-family:var(--disp);font-size:calc(var(--s)*9px*var(--dsz));line-height:1;color:var(--ink);background:var(--panel);
  border:calc(var(--s)*2px) solid var(--line);padding:calc(var(--s)*9px) calc(var(--s)*11px);cursor:pointer;border-radius:calc(var(--s)*4px)}
.btn.ko{font-family:var(--ko);font-size:calc(var(--s)*17px);padding:calc(var(--s)*10px) calc(var(--s)*16px)}
.btn:focus-visible,.card:focus-visible,.buy:focus-visible{outline:calc(var(--s)*2px) solid var(--gold);outline-offset:calc(var(--s)*2px)}
.btn.big{font-size:calc(var(--s)*14px*var(--dsz));padding:calc(var(--s)*16px) calc(var(--s)*30px);background:var(--gold);color:var(--btnInk);border-color:var(--gold);box-shadow:calc(var(--s)*4px) calc(var(--s)*4px) 0 var(--hot);animation:pulse 1.4s ease-in-out infinite}
.btn.big:active{transform:translate(calc(var(--s)*2px),calc(var(--s)*2px));box-shadow:calc(var(--s)*2px) calc(var(--s)*2px) 0 var(--hot)}
.btn.ad{border-color:var(--cool);color:var(--cool)}
.btn.ad::after{content:"AD";font-family:var(--disp);font-size:calc(var(--s)*7px*var(--dsz));margin-left:calc(var(--s)*8px);padding:calc(var(--s)*3px);background:var(--cool);color:var(--bg);vertical-align:middle}
#snd{position:absolute;left:calc(var(--s)*14px);bottom:calc(var(--s)*12px)}
#recall{position:absolute;right:calc(var(--s)*14px);bottom:calc(var(--s)*12px);font-family:var(--ko);font-size:calc(var(--s)*15px);padding:calc(var(--s)*7px) calc(var(--s)*12px)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*13px);
  background:var(--ov);padding:calc(var(--s)*24px);text-align:center;box-sizing:border-box}
#title{background:linear-gradient(var(--ov) 0 30%,transparent 46%,transparent 54%,var(--ov) 72%)}
.logo{font-family:var(--disp);font-size:calc(var(--s)*30px*var(--dsz));line-height:1.15;color:var(--gold);text-shadow:calc(var(--s)*3px) calc(var(--s)*3px) 0 var(--hot),calc(var(--s)*6px) calc(var(--s)*6px) 0 var(--logo2);margin:0;animation:bob 2.4s ease-in-out infinite}
.sub{font-size:calc(var(--s)*20px);color:var(--cool);margin:0}
.picker{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:calc(var(--s)*10px);width:100%;background:var(--panel);border:calc(var(--s)*2px) solid var(--line);border-radius:calc(var(--s)*6px);padding:calc(var(--s)*8px);box-sizing:border-box}
.picker .btn{font-size:calc(var(--s)*14px);padding:calc(var(--s)*10px) calc(var(--s)*12px)}
.thTag{font-size:calc(var(--s)*21px);margin:0;color:var(--gold)}
.thNo{font-family:var(--disp);font-size:calc(var(--s)*7px*var(--dsz));color:var(--dim);margin:0}
.small{font-family:var(--disp);font-size:calc(var(--s)*8px*var(--dsz));color:var(--dim);line-height:1.8;margin:0}
.note{font-size:calc(var(--s)*15px);color:var(--dim);margin:0}
.gold{font-family:var(--disp);font-size:calc(var(--s)*11px*var(--dsz));color:var(--gold);margin:0}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--s)*10px)}
h2{font-family:var(--disp);font-size:calc(var(--s)*20px*var(--dsz));color:var(--gold);margin:0;text-shadow:calc(var(--s)*3px) calc(var(--s)*3px) 0 var(--hot)}
#metaList{display:grid;gap:calc(var(--s)*8px);width:100%}
/* Level-up: three tall cards side by side that flip in, behind them slow light rays */
#lvl{gap:calc(var(--s)*6px);padding-inline:calc(var(--s)*14px);overflow:hidden}
#lvl > *{position:relative}
#lvl .rays{position:absolute;left:50%;top:44%;width:calc(var(--s)*900px);height:calc(var(--s)*900px);margin:calc(var(--s)*-450px) 0 0 calc(var(--s)*-450px);pointer-events:none;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--gold) 16%,transparent) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:spin 14s linear infinite,raysIn .35s ease-out both}
.lvlKick{font-family:var(--disp);font-size:calc(var(--s)*10px*var(--dsz));letter-spacing:.3em;color:var(--cool);margin:0;animation:fadeUp .25s ease-out both}
.lvlNum{font-family:var(--disp);font-size:calc(var(--s)*44px*var(--dsz));line-height:1;color:var(--gold);margin:0;text-shadow:0 0 calc(var(--s)*24px) color-mix(in srgb,var(--gold) 70%,transparent);animation:numPop .4s cubic-bezier(.2,1.8,.4,1) both}
#lvl .note{margin-bottom:calc(var(--s)*10px)}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--s)*9px);width:100%;perspective:calc(var(--s)*800px)}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*7px);min-width:0;text-align:center;cursor:pointer;
  background:var(--panel);color:var(--ink);border:calc(var(--s)*2px) solid var(--c,var(--line));padding:calc(var(--s)*14px) calc(var(--s)*8px) calc(var(--s)*12px);border-radius:calc(var(--s)*14px);font-family:var(--ko);
  box-shadow:0 0 calc(var(--s)*22px) color-mix(in srgb,var(--c) 35%,transparent),0 calc(var(--s)*8px) calc(var(--s)*20px) rgba(0,0,0,.35);
  animation:flipIn .32s cubic-bezier(.2,1.5,.4,1) backwards;transition:transform .16s ease,opacity .16s ease,box-shadow .16s ease}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:shine .7s ease-out .3s both;pointer-events:none}
.card:nth-child(2)::after{animation-delay:.36s}.card:nth-child(3)::after{animation-delay:.42s}
.card:active{transform:scale(.96)}
.card .ic{display:grid;place-items:center;width:calc(var(--s)*58px);height:calc(var(--s)*58px);border-radius:50%;background:var(--c);color:#0a0c1c;
  box-shadow:0 0 0 calc(var(--s)*4px) color-mix(in srgb,var(--c) 25%,transparent),0 0 calc(var(--s)*18px) var(--c)}
.card .ic svg{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card .cn{font-size:calc(var(--s)*18px);line-height:1.1}
.card .cd{font-size:calc(var(--s)*13px);line-height:1.3;color:var(--dim);flex:1}
.card .lv{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--s)*3px)}
.card .lv i{width:calc(var(--s)*7px);height:calc(var(--s)*7px);border-radius:50%;background:var(--line)}
.card .lv i.on{background:var(--c)}
.card .lv i.nx{background:var(--c);animation:blink .5s ease-in-out infinite alternate}
.card .lvt{font-family:var(--disp);font-size:calc(var(--s)*8px*var(--dsz));color:var(--dim)}
.card .new{position:absolute;top:calc(var(--s)*6px);right:calc(var(--s)*-22px);transform:rotate(35deg);background:var(--hot);color:#fff;font-family:var(--disp);font-size:calc(var(--s)*7px*var(--dsz));padding:calc(var(--s)*3px) calc(var(--s)*24px)}
.card.chosen{transform:scale(1.1);z-index:2;box-shadow:0 0 calc(var(--s)*40px) var(--c),0 0 0 calc(var(--s)*3px) #fff}
.card.dim{opacity:.18;transform:scale(.9)}
.locked .card{pointer-events:none}
@keyframes flipIn{from{transform:rotateY(95deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes numPop{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(calc(var(--s)*10px));opacity:0}to{transform:none;opacity:1}}
@keyframes raysIn{from{opacity:0;transform:scale(.4)}to{opacity:1}}
@keyframes spin{to{rotate:360deg}}
@keyframes blink{to{opacity:.35}}
.meta{display:grid;grid-template-columns:1fr auto;align-items:center;gap:calc(var(--s)*10px);background:var(--panel);border:calc(var(--s)*2px) solid var(--line);border-radius:calc(var(--s)*6px);padding:calc(var(--s)*9px) calc(var(--s)*12px);text-align:left}
.meta .mn{font-size:calc(var(--s)*19px)}
.meta .md{font-size:calc(var(--s)*14px);color:var(--dim)}
.pips{display:flex;flex-wrap:wrap;gap:calc(var(--s)*3px);margin-top:calc(var(--s)*5px)}
.pips i{width:calc(var(--s)*8px);height:calc(var(--s)*8px);background:var(--line)}
.pips i.on{background:var(--gold)}
.lvtag{font:700 calc(var(--s)*11px) 'Chakra Petch',sans-serif;color:var(--gold);margin-left:calc(var(--s)*4px)}
.buy{font-family:var(--disp);font-size:calc(var(--s)*9px*var(--dsz));min-width:calc(var(--s)*74px);padding:calc(var(--s)*10px) calc(var(--s)*8px);background:var(--gold);color:var(--btnInk);border:0;border-radius:calc(var(--s)*4px);cursor:pointer}
.buy:disabled{background:var(--line);color:var(--dim);cursor:default}
#stats{display:grid;grid-template-columns:1fr auto;gap:calc(var(--s)*7px) calc(var(--s)*24px);font-size:calc(var(--s)*17px);text-align:left;width:80%}
#stats span:nth-child(even){font-family:var(--disp);font-size:calc(var(--s)*12px*var(--dsz));color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
#build{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--s)*6px)}
#build span{font-family:var(--disp);font-size:calc(var(--s)*8px*var(--dsz));padding:calc(var(--s)*6px);background:var(--c);color:#0a0c1c;border-radius:calc(var(--s)*3px)}
/* Stage map: one panel per world in that world's colours, four stage nodes on a zigzag path */
#map{justify-content:flex-start;gap:calc(var(--s)*8px)}
#mapList{width:100%;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:grid;gap:calc(var(--s)*10px);padding:calc(var(--s)*2px);box-sizing:border-box}
.world{background:linear-gradient(100deg,rgba(6,8,16,.92) 30%,rgba(6,8,16,.35)),var(--thumb) center/cover;border:1px solid rgba(255,255,255,.75);border-radius:calc(var(--s)*20px);padding:calc(var(--s)*10px) calc(var(--s)*12px);text-align:left;color:var(--ink);box-shadow:0 calc(var(--s)*8px) calc(var(--s)*22px) rgba(60,40,120,.15)}
.world header{display:flex;align-items:baseline;gap:calc(var(--s)*8px)}
.world header b{font-family:var(--disp);font-size:calc(var(--s)*12px);color:var(--wa)}
.world header span{font-size:calc(var(--s)*18px)}
.world p{margin:calc(var(--s)*2px) 0 calc(var(--s)*6px);font-size:calc(var(--s)*13px);color:var(--dim)}
.world.locked{filter:grayscale(.6);opacity:.6}
.path{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--s)*6px);position:relative}
.path::before{content:"";position:absolute;left:12%;right:12%;top:calc(var(--s)*30px);border-top:calc(var(--s)*3px) dashed color-mix(in srgb,var(--wa) 45%,transparent)}
.node{position:relative;display:grid;justify-items:center;gap:calc(var(--s)*3px);background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.node:nth-child(even){margin-top:calc(var(--s)*14px)}
.node .dot{display:grid;place-items:center;width:calc(var(--s)*46px);height:calc(var(--s)*46px);border-radius:50%;background:linear-gradient(160deg,color-mix(in srgb,var(--wa) 70%,#fff),var(--wa));color:#fff;font-family:var(--disp);font-size:calc(var(--s)*13px);font-weight:800;border:calc(var(--s)*2px) solid rgba(255,255,255,.85);box-shadow:0 calc(var(--s)*4px) calc(var(--s)*10px) color-mix(in srgb,var(--wa) 45%,transparent)}
.node.boss .dot{width:calc(var(--s)*54px);height:calc(var(--s)*54px);box-shadow:0 0 0 calc(var(--s)*3px) color-mix(in srgb,#f2a541 70%,transparent),0 calc(var(--s)*4px) calc(var(--s)*12px) rgba(242,165,65,.5)}
.node .dot svg{width:45%;height:45%;fill:none;stroke:currentColor;stroke-width:2.4}
.node.lock .dot{background:rgba(120,120,150,.35);color:#fff;box-shadow:none}
.node.cur .dot{animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 0 calc(var(--s)*4px) color-mix(in srgb,var(--wa) 40%,transparent),0 0 calc(var(--s)*18px) var(--wa)}
.node.sel .dot{outline:calc(var(--s)*3px) solid #fff;outline-offset:calc(var(--s)*3px)}
.node .st{font-size:calc(var(--s)*12px);letter-spacing:.05em}
.node .st i,.stars i{font-style:normal;color:rgba(128,128,150,.45)}
.node .st i.on{color:#ffd23f}
.mapSel{width:100%;display:grid;gap:calc(var(--s)*8px);background:var(--panel);border:calc(var(--s)*2px) solid var(--line);border-radius:calc(var(--s)*14px);padding:calc(var(--s)*10px);box-sizing:border-box}
.mapSel .note{color:var(--ink);font-size:calc(var(--s)*15px)}
.mapSel .btn.big:disabled{filter:grayscale(1);opacity:.5;animation:none}
#endless:disabled{opacity:.45}
.stars{margin:0;font-size:calc(var(--s)*44px);line-height:1;letter-spacing:.08em}
.stars i{display:inline-block}
.stars i.on{color:#ffd23f;text-shadow:0 0 calc(var(--s)*18px) rgba(255,210,63,.8);animation:starPop .45s cubic-bezier(.2,1.8,.4,1) both}
.newNote{margin:0;font-size:calc(var(--s)*17px);color:var(--cool)}
#over.win h2{animation:numPop .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starPop{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
#shieldOffer{position:absolute;left:calc(var(--s)*12px);right:calc(var(--s)*12px);bottom:calc(var(--s)*92px);display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:calc(var(--s)*10px);
  padding:calc(var(--s)*10px) calc(var(--s)*12px);background:color-mix(in srgb,var(--panel) 92%,transparent);border:calc(var(--s)*2px) solid #6ec8ff;border-radius:calc(var(--s)*14px);
  box-shadow:0 0 calc(var(--s)*24px) rgba(110,200,255,.5);color:var(--ink);overflow:hidden;z-index:5}
#shieldOffer.go{animation:offerIn .35s cubic-bezier(.2,1.6,.4,1) both}
#shieldOffer svg{width:calc(var(--s)*30px);height:calc(var(--s)*30px);fill:#6ec8ff}
#shieldOffer b{display:block;font-size:calc(var(--s)*17px)}
#shieldOffer span{display:block;font-size:calc(var(--s)*12px);color:var(--dim)}
#shieldOffer .btn{padding:calc(var(--s)*8px) calc(var(--s)*10px)}
#shieldOffer .bar{position:absolute;left:0;bottom:0;height:calc(var(--s)*3px);width:100%;background:#6ec8ff;transform-origin:left}
#shieldOffer.go .bar{animation:drain 6s linear both}
@keyframes offerIn{from{transform:translateY(calc(var(--s)*60px));opacity:0}to{transform:none;opacity:1}}
@keyframes drain{to{transform:scaleX(0)}}
/* ---- Neon: dark panels with lit edges, glowing type ---- */
#stage[data-dir="neon"] .ov{backdrop-filter:blur(calc(var(--s)*6px));-webkit-backdrop-filter:blur(calc(var(--s)*6px))}
#stage[data-dir="neon"] .btn{border-radius:calc(var(--s)*10px);border:1px solid color-mix(in srgb,var(--cool) 55%,transparent);background:rgba(10,12,24,.85);color:var(--ink);box-shadow:0 0 calc(var(--s)*12px) color-mix(in srgb,var(--cool) 25%,transparent),inset 0 0 calc(var(--s)*10px) color-mix(in srgb,var(--cool) 12%,transparent)}
#stage[data-dir="neon"] .btn.big{background:linear-gradient(120deg,var(--cool),var(--logo2));color:#04050a;border:0;border-radius:calc(var(--s)*12px);box-shadow:0 0 calc(var(--s)*26px) color-mix(in srgb,var(--cool) 60%,transparent),0 0 calc(var(--s)*60px) color-mix(in srgb,var(--logo2) 35%,transparent);letter-spacing:.12em}
#stage[data-dir="neon"] .btn.big:active{transform:scale(.97)}
#stage[data-dir="neon"] .logo{color:#fff;text-shadow:0 0 calc(var(--s)*6px) #fff,0 0 calc(var(--s)*16px) var(--cool),0 0 calc(var(--s)*34px) var(--cool),0 0 calc(var(--s)*60px) var(--logo2);letter-spacing:.06em}
#stage[data-dir="neon"] h2{color:#fff;text-shadow:0 0 calc(var(--s)*8px) var(--cool),0 0 calc(var(--s)*22px) var(--cool);letter-spacing:.08em}
#stage[data-dir="neon"] .sub{color:var(--cool);letter-spacing:.24em;font-size:calc(var(--s)*14px);text-shadow:0 0 calc(var(--s)*10px) var(--cool)}
#stage[data-dir="neon"] .card,#stage[data-dir="neon"] .meta,#stage[data-dir="neon"] .mapSel{background:rgba(8,10,20,.9);border:1px solid color-mix(in srgb,var(--c,var(--cool)) 60%,transparent);border-radius:calc(var(--s)*14px);box-shadow:0 0 calc(var(--s)*18px) color-mix(in srgb,var(--c,var(--cool)) 30%,transparent),inset 0 0 calc(var(--s)*16px) color-mix(in srgb,var(--c,var(--cool)) 10%,transparent)}
#stage[data-dir="neon"] .world{border:1px solid color-mix(in srgb,var(--wa) 55%,transparent);box-shadow:0 0 calc(var(--s)*16px) color-mix(in srgb,var(--wa) 25%,transparent)}
#stage[data-dir="neon"] .node .dot{background:rgba(6,8,16,.9);color:#fff;border:calc(var(--s)*2px) solid var(--wa);box-shadow:0 0 calc(var(--s)*12px) var(--wa),inset 0 0 calc(var(--s)*8px) color-mix(in srgb,var(--wa) 40%,transparent)}
#stage[data-dir="neon"] .node.lock .dot{border-color:rgba(255,255,255,.2);box-shadow:none;color:rgba(255,255,255,.5)}
#stage[data-dir="neon"] .prize div,#stage[data-dir="neon"] .rrow{background:rgba(8,10,20,.9);border:1px solid rgba(255,255,255,.12)}
#stage[data-dir="neon"] .prize div:first-child{background:linear-gradient(135deg,#ffd000,#ff6a3d);color:#04050a;border:0;box-shadow:0 0 calc(var(--s)*20px) rgba(255,208,0,.45)}
#stage[data-dir="neon"] .rrow.me{border-color:var(--cool);box-shadow:0 0 calc(var(--s)*14px) color-mix(in srgb,var(--cool) 40%,transparent)}
#stage[data-dir="neon"] .card .ic{color:#04050a}


#rank{justify-content:flex-start;gap:calc(var(--s)*8px)}
.zoneHead{display:flex;align-items:baseline;gap:calc(var(--s)*10px);padding:calc(var(--s)*6px) calc(var(--s)*4px) 0;border-bottom:calc(var(--s)*2px) solid var(--wa);box-shadow:0 calc(var(--s)*6px) calc(var(--s)*14px) calc(var(--s)*-10px) var(--wa)}
.zoneHead b{font-family:var(--disp);font-size:calc(var(--s)*11px);color:var(--wa);letter-spacing:.14em}
.zoneHead span{font-family:var(--disp);font-size:calc(var(--s)*20px);font-weight:700;color:#fff;text-shadow:0 0 calc(var(--s)*10px) var(--wa),0 0 calc(var(--s)*22px) var(--wb);letter-spacing:.06em}
.zoneHead em{font-style:normal;font-size:calc(var(--s)*13px);color:var(--wb);margin-left:auto}
.prize{width:100%;display:grid;grid-template-columns:1.6fr 1fr;gap:calc(var(--s)*8px)}
.prize div{background:var(--panel);border:1px solid rgba(255,255,255,.75);border-radius:calc(var(--s)*14px);padding:calc(var(--s)*8px);display:grid;gap:calc(var(--s)*2px)}
.prize div:first-child{background:linear-gradient(135deg,#ffe9a8,#ffc46b);color:#5a3a00;border:0}
.prize b{font-family:var(--disp);font-size:calc(var(--s)*14px)}
.prize span{font-size:calc(var(--s)*12px)}
#rankList{width:100%;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:grid;align-content:start;gap:calc(var(--s)*6px)}

<script>
(() => {
// ---- 00-config.js ----
'use strict';
// Field geometry (logical units; the canvas is scaled to the screen).
const W = 420, H = 780, COLS = 7, CW = 60, RH = 36, TOP = 76, ROWS = 17;
const FB = TOP + ROWS * RH;   // red line (688): a brick reaching it costs HP
const LY = 716;               // launcher line
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
// Big numbers: 999, 1.23K, 45.6M, 7.89B, 1.2T, then aa, ab, ac ... (each step x1000).
// Cut (not rounded) to 3 significant digits, so a balance never reads higher than it is.
const BIG = ['', 'K', 'M', 'B', 'T'];
function fmtBig(n) {
  if (!(n >= 1000)) return String(Math.max(0, Math.floor(n + 1e-9)));
  if (!isFinite(n)) return '\u221e';
  const e = Math.floor(Math.log10(n) / 3 + 1e-12), m = n / Math.pow(1000, e), d = m < 10 ? 100 : m < 100 ? 10 : 1;
  const s = e < BIG.length ? BIG[e] : String.fromCharCode(97 + Math.floor((e - BIG.length) / 26) % 26, 97 + (e - BIG.length) % 26);
  return String(Math.floor(m * d + 1e-9) / d) + s;
}
const fmtN = n => n < 1e5 ? Math.floor(n).toLocaleString('ko-KR') : fmtBig(n); // 31000 -> "31,000", 2.5e6 -> "2.5M"
const withG = s => s + (/[A-Za-z]$/.test(s) ? ' G' : 'G'); // "45,000G" but "188K G"
const fmtGold = n => withG(fmtN(n));
const fmtMul = x => x < 10 ? String(Math.round(x * 100) / 100) : x < 100 ? String(Math.round(x * 10) / 10) : fmtBig(x); // x1.13, x21.2, x9.6K
const $ = id => document.getElementById(id);

// Balance knobs. Every tuning number lives here; t = turn number.
const BAL = {
  startBalls: 5,
  ballSpeed: 760, fireGap: 0.055,
  hp: t => Math.max(1, Math.round(t * (1 + t / 12) * Math.pow(1.045, t))), // exponential tail ends runaway builds
  density: t => Math.min(0.82, 0.48 + t * 0.012),
  doubleHp: 0.15,
  bomb: t => t > 2 ? 0.06 : 0,
  chest: t => t > 3 ? 0.015 : 0,
  steel: t => t > 8 ? 0.05 : 0,
  slime: t => t > 5 ? 0.06 : 0,
  orb: 0.4,
  laser: t => t > 4 ? 0.14 : 0,
  chapterLen: 10, // turns per chapter: boss gold grows with it and the backdrop shifts
  // A run opens with startRows rows of easy bricks. From turn doubleRowFrom on, a player who keeps
  // every brick within the top doubleRowDepth+1 rows gets two new rows at once (DOUBLE ROW), at most
  // once every doubleRowGap turns.
  startRows: 6, doubleRowFrom: 4, doubleRowDepth: 3, doubleRowGap: 3,
  // Classic bosses come on set turns, each moved by up to +-bossJitter at random: the boss on turn
  // 20 and the main boss on 40 (the 5th level of a stage: 20, 30, then the stage boss on 40).
  // Only one boss at a time: if the previous one is still alive the next waits until bossRest
  // turns after it dies. Endless sends a boss on a random turn in endlessFirst, then endlessGap
  // turns after the previous one arrived. Boss HP = that turn's brick HP x the multiplier.
  bossTurns: [20, 40], stageBossTurns: [20, 30, 40], bossJitter: 3, bossRest: 2,
  endlessFirst: [11, 14], endlessGap: [8, 10],
  // Classic levels are long (the main boss comes around turn 40), so there brick HP and row density
  // climb per turn at this fraction of the endless speed.
  classicPace: 0.58,
  bossHp: 6, mainBossHp: 9, stageBossHp: 8,
  // Number inflation (classic): brick HP and gold both grow x1.13 per level (x1.84 per stage), so the
  // numbers climb from tens into K, M, B and beyond. 기본 화력 in the workshop multiplies damage by
  // dmgStep per level to keep up.
  hpGrowth: 1.13, goldGrowth: 1.13, dmgStep: 1.25,
  // Brick HP multiplier for classic level g (0-based). Stage 1 eases in (x0.35 of the curve at 1-1)
  // so a first-time player with no upgrades gets through 1-1; from 2-1 on it is plain x1.13 per level.
  // classicHp: a run levels up 10+ times before its main boss, so classic bricks start tougher.
  levelHp: g => BAL.classicHp * Math.pow(BAL.hpGrowth, g) * Math.min(1, 0.35 + 0.13 * g),
  classicHp: 2.2,
  // v1.7: a run builds up over a long level: about LV 5 by the boss on turn 20 and LV 9 by the main
  // boss on turn 40. XP chests give a whole level.
  xpNeed: lvl => Math.round(5 + 1.5 * lvl + 0.06 * lvl * lvl),
  xpBrick: 0.38, xpSteel: 2, xpBoss: 15, xpTurnBonus: 0, // xpTurnBonus: +1 XP per that many turns (0 = off)
  goldPerKill: 0.1, goldPerTurn: 0.5, goldBoss: 25, goldChapter: ch => ch * 15,
};

const chapterOf = t => Math.ceil(t / BAL.chapterLen);
const randIn = ([a, b]) => a + Math.floor(rnd() * (b - a + 1));

// DOM
const cv = $('cv'), ctx = cv.getContext('2d');
const stage = $('stage'), wrap = $('wrap');
const titleEl = $('title'), lvlEl = $('lvl'), cardsEl = $('cards'), overEl = $('over'), shopEl = $('shop');
const recallEl = $('recall'), sndEl = $('snd');

// ---- 10-audio.js ----
// Chiptune blips synthesized with WebAudio. Audio starts on the first tap.
let AC = null, master = null, noiseBuf = null, muted = false;
const lastSfx = {};
function ensureAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor();
      master = AC.createGain(); master.gain.value = 0.7;
      master.connect(comp).connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.4, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function gate(key, ms) {
  if (!AC || muted) return false;
  const t = AC.currentTime * 1000;
  if (lastSfx[key] && t - lastSfx[key] < ms) return false;
  lastSfx[key] = t; return true;
}
function tone(f, dur, type = 'square', vol = 0.05, slide = 0, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq = 900) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur);
}
const sfx = {
  shoot() { if (gate('shoot', 45)) tone(880, 0.025, 'square', 0.018); },
  hit() { if (gate('hit', 28)) tone(260 + rnd() * 80, 0.03, 'square', 0.03); },
  steel() { if (gate('steel', 40)) tone(1800 + rnd() * 300, 0.04, 'triangle', 0.03); },
  wall() { if (gate('wall', 60)) tone(180, 0.02, 'triangle', 0.02); },
  brk(c) { if (!gate('brk', 32)) return; const f = 330 * Math.pow(2, Math.min(c, 24) / 12); tone(f, 0.09, 'triangle', 0.09); tone(f * 2, 0.05, 'square', 0.02); },
  boom() { if (!gate('boom', 70)) return; noise(0.28, 0.22, 800); tone(120, 0.22, 'sine', 0.2, 0.35); },
  zap() { if (gate('zap', 60)) tone(1500, 0.09, 'sawtooth', 0.03, 0.25); },
  laser() { if (gate('laser', 50)) { tone(2200, 0.12, 'sawtooth', 0.035, 0.2); noise(0.08, 0.05, 4000); } },
  slime() { if (gate('slime', 60)) tone(200, 0.12, 'sine', 0.1, 2.2); },
  orb() { if (!gate('orb', 50)) return; tone(988, 0.05, 'square', 0.04); tone(1318, 0.08, 'square', 0.04, 0, 0.05); },
  lvl() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.1, 'square', 0.05, 0, i * 0.07)); },
  pick() { tone(784, 0.06, 'square', 0.05); tone(1175, 0.1, 'square', 0.05, 0, 0.06); },
  crunch(n) { if (!gate('crunch', 40)) return; noise(0.12, 0.07 + Math.min(n, 10) * 0.012, 5200); tone(95, 0.12, 'sine', 0.1, 0.5); },
  slam(lv) { noise(0.4 + lv * 0.1, 0.22 + lv * 0.04, 1600); tone(80 - lv * 8, 0.45, 'sine', 0.3, 0.35); if (lv >= 2) tone(1400, 0.3, 'sawtooth', 0.03, 0.3, 0.05); },
  whoosh() { noise(0.5, 0.1, 700); tone(500, 0.5, 'sine', 0.04, 0.3); },
  beat() { if (!gate('beat', 300)) return; tone(62, 0.12, 'sine', 0.28); tone(55, 0.14, 'sine', 0.22, 0, 0.17); },
  tick() { if (gate('tick', 45)) tone(1760 + rnd() * 400, 0.03, 'square', 0.02); },
  coin() { tone(1318, 0.06, 'square', 0.04); tone(1760, 0.14, 'square', 0.04, 0, 0.06); },
  hurt() { tone(170, 0.35, 'sawtooth', 0.12, 0.45); noise(0.2, 0.15, 400); },
  boss() { [196, 185, 175].forEach((f, i) => tone(f, 0.18, 'sawtooth', 0.08, 0, i * 0.2)); },
  clear() { [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone(f, 0.12, 'square', 0.05, 0, i * 0.08)); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, 'triangle', 0.1, 0, i * 0.18)); },
};
let lastBuzz = 0;
function buzz(ms) {
  const t = performance.now(); if (t - lastBuzz < 70) return; lastBuzz = t;
  try {
    // inside the Expo app, native haptics (iOS has no navigator.vibrate)
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ t: 'haptic', s: ms >= 60 ? 'heavy' : ms >= 25 ? 'medium' : 'light' }));
    else if (navigator.vibrate) navigator.vibrate(ms);
  } catch (e) {}
}

// ---- 20-data.js ----
// In-run upgrade cards. desc(n) describes the card at its next level n.
const zapEvery = l => Math.max(4, 10 - l * 2);
const fmtDmg = d => d >= 100 ? fmtBig(d) : String(Math.round(d * 10) / 10);
const UPG = {
  multi:  { tag: 'BALL+4', name: '공 추가',   max: 99, col: '#3ee6ff', w: 3,   desc: () => '발사하는 공 +4개', apply() { S.balls += 4; } },
  power:  { tag: 'DMG+',   name: '공격력',    max: 99, col: '#ff6b6b', w: 3,   desc: () => `모든 공격 피해 +${fmtDmg(S.unit * 0.8)} (현재 ${fmtDmg(S.dmg)})`, apply() { S.dmg += S.unit * 0.8; } },
  crit:   { tag: 'CRIT',   name: '치명타',    max: 4,  col: '#ffd23f', w: 2,   desc: n => `${15 * n}% 확률로 3배 피해`, apply() { S.crit = 0.15 * S.lv.crit; } },
  fire:   { tag: 'FIRE',   name: '화염탄',    max: 5,  col: '#ff8a3d', w: 2,   desc: n => `벽돌을 부수면 주변에 불꽃 폭발 (공격력 ×${n + 1.5})`, apply() {} },
  chain:  { tag: 'ZAP',    name: '연쇄 번개', max: 5,  col: '#a5e9ff', w: 2,   desc: n => `${zapEvery(n)}번 맞힐 때마다 가까운 벽돌 ${n + 1}개에 번개가 떨어짐`, apply() {} },
  pierce: { tag: 'PIERCE', name: '관통',      max: 4,  col: '#b98cff', w: 1.5, desc: n => `${15 * n}% 확률로 벽돌을 뚫고 지나감`, apply() { S.pierce = 0.15 * S.lv.pierce; } },
  split:  { tag: 'SPLIT',  name: '분열',      max: 4,  col: '#ff9be0', w: 2,   desc: n => `공이 처음 맞힐 때 ${n + 1}갈래로 갈라짐`, apply() {} },
  rush:   { tag: 'RUSH',   name: '폭주',      max: 4,  col: '#ff6a3d', w: 2,   desc: n => `벽돌을 맞힐 때마다 그 공의 피해 +${20 * n}%, 속도도 빨라짐`, apply() {} },
  iron:   { tag: 'IRON',   name: '철구',      max: 3,  col: '#b8c2d9', w: 1.6, desc: n => `매 턴 ${n >= 3 ? '처음 두 공이' : '첫 공이'} 쇠공이 되어 벽돌을 모두 뚫고 ${n + 1}배 피해`, apply() {} },
  encore: { tag: 'ENCORE', name: '앙코르',    max: 3,  col: '#ffe14d', w: 1.6, desc: n => `${5 - n}턴마다 반드시, 공이 모두 돌아오면 같은 방향으로 한 번 더 발사`, apply() {} },
  bounce: { tag: 'BOUNCE', name: '바운스 패드', max: 3, col: '#5effa8', w: 1.8, desc: n => `바닥에 닿은 공이 ${25 * n}% 확률로 다시 튕겨 오름 (공마다 최대 ${n}번)`, apply() {} },
  acid:   { tag: 'ACID',   name: '부식',      max: 4,  col: '#a6ff3d', w: 1.8, desc: n => `맞힐 때마다 부식이 ${n}씩 쌓이고, 턴이 끝날 때 부식 1마다 공격력의 30% 피해`, apply() {} },
  xp:     { tag: 'XP',     name: '학습',      max: 4,  col: '#c6ff5e', w: 1,   desc: n => `경험치 획득 +${40 * n}%`, apply() {} },
};

// Card icons: 24x24 stroke paths drawn in the card's colour circle.
const ICONS = {
  multi: '<circle cx="7" cy="16" r="3.2"/><circle cx="17" cy="16" r="3.2"/><circle cx="12" cy="7" r="3.2"/>',
  power: '<path d="M14.5 3.5h6v6l-9.5 9.5-6-6z"/><path d="M4 16l4 4M2.5 21.5l3-3"/>',
  crit: '<circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/><circle cx="12" cy="12" r="1.2"/>',
  fire: '<path d="M12 2.5c1 4 6.5 6 6.5 11.5a6.5 6.5 0 0 1-13 0c0-3 2-4.5 2.2-7.5 2 1.2 3 3 3 5 1.3-2 1.6-5.6 1.3-9z"/>',
  chain: '<path d="M13.5 2L5 13.5h6.5L10 22l9-12h-6.5z"/>',
  pierce: '<rect x="9" y="4.5" width="6" height="15" rx="1.5"/><path d="M1.5 12h21M18.5 8l4 4-4 4"/>',
  split: '<path d="M12 22v-9M12 13L6 4.5M12 13l6-8.5M3.5 6.5L6 4.5l2.2 2.3M20.5 6.5L18 4.5l-2.2 2.3"/>',
  rush: '<path d="M3 17c4 0 5-3 8-3s4 3 8 3M3 11c4 0 5-3 8-3s4 3 8 3"/><path d="M17 4l3 3-3 3"/>',
  iron: '<circle cx="12" cy="12" r="8.5"/><path d="M8 9.5a4.5 4.5 0 0 1 4-3"/><path d="M3.5 12h-2M22.5 12h-2"/>',
  encore: '<path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7M20 3.5v5.2h-5.2"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3M4 20.5v-5.2h5.2"/>',
  bounce: '<path d="M2.5 19.5h19"/><path d="M5 19.5l2-4h10l2 4"/><circle cx="12" cy="6.5" r="3"/><path d="M12 10.5v2"/>',

  heal: '<path d="M12 20.5s-8-4.8-8-10.8a4.4 4.4 0 0 1 8-2.6 4.4 4.4 0 0 1 8 2.6c0 6-8 10.8-8 10.8z"/><path d="M12 9v6.5M8.8 12.2h6.4"/>',
};

// The one-off shield that can be offered once per run (rewarded-ad placeholder).
const SHIELD_COL = '#6ec8ff';

// Permanent upgrades bought with gold in the workshop. Each next level costs the last price times a
// step that itself grows (r0, r0 + dr, r0 + 2dr ...), so prices climb faster and faster. 기본 화력
// has no cap: multiplying damage is how the player keeps up with inflating brick HP.
const dmgMult = P => Math.pow(BAL.dmgStep, P);
const META = {
  balls: { name: '시작 공',   max: 10,       base: 60,   r0: 3,    dr: 0.3, desc: l => `시작할 때 공 +1 (지금 ${BAL.startBalls + l}개)` },
  power: { name: '기본 화력', max: Infinity, base: 200,  r0: 1.32, dr: 0,   desc: l => `공격력 ×${BAL.dmgStep}씩 곱해짐 (지금 ×${fmtMul(dmgMult(l))})` },
  xp:    { name: '훈련',      max: 5,        base: 250,  r0: 4,    dr: 1,   desc: l => `경험치 획득 +10% (지금 +${10 * l}%)` },
  start: { name: '선행 연구', max: 2,        base: 8000, r0: 50,   dr: 0,   desc: l => `시작할 때 능력 1개 선택 (지금 ${l}개)` },
  gold:  { name: '수집가',    max: 5,        base: 300,  r0: 4,    dr: 1,   desc: l => `골드 획득 +15% (지금 +${15 * l}%)` },
};
// Prices keep 3 significant digits (5G steps under 1,000), so the price shown is the price paid.
const niceCost = c => c < 1000 ? Math.max(5, Math.round(c / 5) * 5) : (p => Math.round(c / p) * p)(Math.pow(10, Math.floor(Math.log10(c)) - 2));
function metaCost(k, l) { const m = META[k]; let c = m.base; for (let i = 0; i < l; i++) c *= m.r0 + m.dr * i; return niceCost(c); }

// ---- 24-landscapes.js ----
// Landscapes: famous real places drawn as neon line art on black, one per stage.
// A recipe lists ridges, water, trees, extras and drifting particles (its sky colours are
// unused in the neon look). Past the last recipe the list repeats as colour remixes, so stages
// never run out. Add places by adding recipes.

// ---------- neon line-art renderer ----------
// The scene is drawn as glowing outlines on black: dark silhouettes hide the lines behind them,
// so the layers still read in depth. The static art is cached; the game dims or brightens it
// with combo energy (see drawBackdrop in 80-render.js).
// Zones: every 5 stages the mood changes (palettes, backdrop light show, brick shape).
// Stages 1-5 NEON DAWN, 6-10 DEEP BLUE, 11-15 INFERNO, 16-20 AURORA, 21-25 COSMOS, then again
// as remixes. The 25 places in LANDS are grouped to suit their zone.
const ZONES = [
  { key: 'dawn', name: 'NEON DAWN', ko: '네온 새벽', style: 'grid', shape: 'round', pals: [['#00e5ff', '#ff2bd6'], ['#7c4dff', '#00f0ff'], ['#00ffd5', '#ff4dc4']] },
  { key: 'blue', name: 'DEEP BLUE', ko: '딥 블루', style: 'waves', shape: 'pill', pals: [['#00d9ff', '#7c4dff'], ['#00ffc8', '#3d7bff'], ['#4dd6ff', '#b14dff']] },
  { key: 'inferno', name: 'INFERNO', ko: '인페르노', style: 'embers', shape: 'chamfer', pals: [['#ff6a3d', '#ffd000'], ['#ff2b6a', '#ffb000'], ['#ff4d1a', '#ff2bd6']] },
  { key: 'aurora', name: 'AURORA', ko: '오로라', style: 'crystal', shape: 'facet', pals: [['#39ff88', '#b14dff'], ['#00ffd5', '#7c4dff'], ['#a6ff3d', '#00b3ff']] },
  { key: 'cosmos', name: 'COSMOS', ko: '코스모스', style: 'warp', shape: 'orb', pals: [['#b14dff', '#ffd000'], ['#ff4dc4', '#4d7cff'], ['#9b4dff', '#00e5ff']] },
];
const STAGES_PER_ZONE = 5;
// zone of stage s (classic) or of endless level s, with a roman numeral once the cycle repeats
const ROMAN = ['', ' II', ' III', ' IV', ' V', ' VI', ' VII', ' VIII', ' IX', ' X'];
function zoneOf(s) {
  const n = Math.floor(s / STAGES_PER_ZONE), Z = ZONES[n % ZONES.length], cyc = Math.floor(n / ZONES.length);
  return { ...Z, n, title: Z.name + (cyc ? ROMAN[cyc] || ` ${cyc + 1}` : ''), first: s % STAGES_PER_ZONE === 0 };
}
function seeded(seed) { let s = seed * 9301 + 49297; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }
const wrapN = (v, m) => ((v % m) + m) % m;
const SHADE = '#05060c';

function neonStroke(g, path, col, w = 1.6) {
  g.save(); g.lineJoin = 'round'; g.lineCap = 'round'; g.globalCompositeOperation = 'lighter'; g.strokeStyle = col;
  g.globalAlpha = 0.16; g.lineWidth = w * 5; g.stroke(path);
  g.globalAlpha = 0.45; g.lineWidth = w * 2.2; g.stroke(path);
  g.globalAlpha = 1; g.lineWidth = w; g.stroke(path);
  g.restore();
}
function neonDot(g, x, y, r, col, a = 1) {
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a;
  const gr = g.createRadialGradient(x, y, 0, x, y, r * 3); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 3, 0, Math.PI * 2); g.fill(); g.restore();
}

// Silhouette (to hide what is behind) and top edge (to glow) for one ridge layer.
function ridgePaths(L) {
  const base = L.b * H, amp = (L.a || 0) * H, r = seeded(L.p * 97 + 13);
  const fill = new Path2D(), edge = new Path2D(), tips = [];
  const line = pts => {
    pts.forEach(([x, y], i) => i ? edge.lineTo(x, y) : edge.moveTo(x, y));
    fill.moveTo(0, H); pts.forEach(([x, y]) => fill.lineTo(x, y)); fill.lineTo(W, H); fill.closePath();
  };
  if (L.k === 'smooth' || L.k === 'dunes' || L.k === 'field') {
    const pts = [];
    for (let x = 0; x <= W; x += 5) {
      const sh = L.k === 'dunes' ? -Math.pow(Math.abs(Math.sin(x * L.f + L.p)), 0.7) : L.k === 'field' ? 0 : Math.sin(x * L.f + L.p) + 0.35 * Math.sin(x * L.f * 2.3 + L.p * 1.7);
      pts.push([x, base + sh * amp]);
    }
    line(pts);
  } else if (L.k === 'peaks') {
    const n = L.f, pts = [[0, base - amp * 0.2]];
    for (let i = 0; i < n; i++) {
      const x0 = (i + 0.2 + r() * 0.3) / n * W, x1 = (i + 0.7 + r() * 0.3) / n * W, p0 = [x0, base - amp * (0.55 + r() * 0.45)];
      pts.push(p0, [x1, base - amp * (0.05 + r() * 0.25)]); tips.push(p0);
    }
    pts.push([W, base - amp * 0.2]); line(pts);
  } else if (L.k === 'mesa') {
    const pts = [[0, base]]; let x = 0;
    while (x < W) { const w = 40 + r() * 70, top = base - amp * (0.3 + r() * 0.7); pts.push([x, base], [x + 8, top], [x + w - 8, top], [x + w, base]); x += w; }
    line(pts);
    for (let y = base - amp * 0.5; y < H; y += 14) { edge.moveTo(0, y); edge.lineTo(W, y); } // strata
  } else if (L.k === 'pillars') {
    for (let i = 0; i < L.f; i++) {
      const x = (i + 0.5 + (r() - 0.5) * 0.6) / L.f * W, w = (14 + r() * 22) * (L.w || 1), h = amp * (0.55 + r() * 0.45);
      for (const P of [fill, edge]) {
        P.moveTo(x - w / 2, base + 30); P.lineTo(x - w / 2 + 3, base - h + w / 2);
        P.quadraticCurveTo(x, base - h - w * 0.3, x + w / 2 - 3, base - h + w / 2); P.lineTo(x + w / 2, base + 30);
      }
      fill.closePath(); tips.push([x, base - h - w * 0.1]);
    }
  } else if (L.k === 'cliffs') {
    const top = L.top * H;
    for (const P of [fill, edge]) {
      P.moveTo(0, top); P.lineTo(W * L.w * 0.7, top + 20); P.lineTo(W * L.w, base); P.lineTo(W * L.w, H);
      P.moveTo(W, top + 30); P.lineTo(W * (1 - L.w * 0.7), top + 45); P.lineTo(W * (1 - L.w), base); P.lineTo(W * (1 - L.w), H);
    }
    fill.lineTo(W, H); fill.closePath(); fill.moveTo(0, H); fill.lineTo(0, top); fill.lineTo(W * L.w * 0.7, top + 20); fill.lineTo(W * L.w, base); fill.lineTo(W * L.w, H); fill.closePath();
  } else if (L.k === 'terraces') {
    const step = (H - base) / L.n;
    for (let i = 0; i < L.n; i++) {
      const pts = []; for (let x = 0; x <= W; x += 6) pts.push([x, base + i * step + Math.sin(x * 0.012 + i * 0.9) * step * 0.6]);
      pts.forEach(([x, y], k) => k ? edge.lineTo(x, y) : edge.moveTo(x, y));
      if (i === 0) { fill.moveTo(0, H); pts.forEach(([x, y]) => fill.lineTo(x, y)); fill.lineTo(W, H); fill.closePath(); }
    }
  } else if (L.k === 'rows') {
    fill.rect(0, base, W, H - base);
    const vx = W * 0.5, vy = base - 10;
    for (let i = -L.n; i <= L.n; i++) { edge.moveTo(vx + i * 3, vy + 12); edge.lineTo(vx + i * 70, H); }
    edge.moveTo(0, base); edge.lineTo(W, base);
  } else if (L.k === 'canopy') {
    const rad = L.r || 24, rr2 = seeded(L.p * 31);
    for (let x = -rad; x < W + rad; x += rad * 0.9) {
      const rr = rad * (0.75 + rr2() * 0.5);
      edge.moveTo(x - rr, base); edge.arc(x, base, rr, Math.PI, 0);
      fill.moveTo(x + rr, base); fill.arc(x, base, rr, 0, Math.PI * 2);
    }
    fill.rect(0, base, W, H - base);
  }
  return { fill, edge, tips };
}

function treePath(kind, x, y, s) {
  const P = new Path2D();
  if (kind === 'pine') {
    for (let k = 0; k < 3; k++) { const w = (16 - k * 3.5) * s, ty = y - (k * 14 + 22) * s; P.moveTo(x, ty - 12 * s); P.lineTo(x + w, ty + 14 * s); P.lineTo(x - w, ty + 14 * s); P.closePath(); }
    P.moveTo(x, y); P.lineTo(x, y - 8 * s);
  } else if (kind === 'cypress') {
    P.ellipse(x, y - 30 * s, 7 * s, 30 * s, 0, 0, Math.PI * 2);
  } else if (kind === 'palm') {
    P.moveTo(x, y); P.quadraticCurveTo(x + 10 * s, y - 30 * s, x + 4 * s, y - 56 * s);
    for (let k = 0; k < 6; k++) { const a = -2.6 + k * 0.9; P.moveTo(x + 4 * s, y - 56 * s); P.quadraticCurveTo(x + 4 * s + Math.cos(a) * 16 * s, y - 56 * s + Math.sin(a) * 16 * s - 6 * s, x + 4 * s + Math.cos(a) * 28 * s, y - 56 * s + Math.sin(a) * 28 * s + 4 * s); }
  } else if (kind === 'baobab') {
    P.moveTo(x - 7 * s, y); P.lineTo(x - 5 * s, y - 50 * s); P.lineTo(x + 5 * s, y - 50 * s); P.lineTo(x + 7 * s, y);
    for (let k = -2; k <= 2; k++) { P.moveTo(x + k * 6 * s + 6 * s, y - 56 * s); P.ellipse(x + k * 6 * s, y - 56 * s, 6 * s, 3.5 * s, 0, 0, Math.PI * 2); }
  } else {
    P.moveTo(x, y); P.lineTo(x, y - 30 * s);
    for (let k = 0; k < 5; k++) { const cx = x + Math.cos(k * 1.25) * 13 * s, cy = y - 40 * s + Math.sin(k * 1.7) * 8 * s; P.moveTo(cx + 11 * s, cy); P.arc(cx, cy, 11 * s, 0, Math.PI * 2); }
  }
  return P;
}

function extraPaint(g, e, pal) {
  const P = new Path2D();
  if (e.k === 'waterfall') { for (let i = 0; i < 4; i++) { const x = e.x * W - e.w / 2 + (i + 0.5) * e.w / 4; P.moveTo(x, e.y0 * H); P.lineTo(x, e.y1 * H); } neonStroke(g, P, '#bff6ff', 1.2); return; }
  if (e.k === 'rainbow') { ['#ff2b6a', '#ffb000', '#ffe600', '#39ff88', '#00b3ff', '#b14dff'].forEach((c, i) => { const A = new Path2D(); A.arc(e.x * W, e.y * H, e.r - i * 7, Math.PI, 0); neonStroke(g, A, c, 1.2); }); return; }
  if (e.k === 'icebergs') { for (const [x, y, s] of e.items) { const X = x * W, Y = y * H; P.moveTo(X - 38 * s, Y); P.lineTo(X - 24 * s, Y - 30 * s); P.lineTo(X - 8 * s, Y - 36 * s); P.lineTo(X + 6 * s, Y - 48 * s); P.lineTo(X + 22 * s, Y - 26 * s); P.lineTo(X + 38 * s, Y); P.closePath(); } g.fillStyle = SHADE; g.fill(P); neonStroke(g, P, '#bff6ff', 1.4); return; }
  if (e.k === 'yurt') { const x = e.x * W, y = e.y * H; P.moveTo(x - 18, y); P.lineTo(x - 18, y - 12); P.quadraticCurveTo(x, y - 30, x + 18, y - 12); P.lineTo(x + 18, y); g.fillStyle = SHADE; g.fill(P); neonStroke(g, P, pal[0], 1.4); neonDot(g, x, y - 5, 4, '#ffd000'); return; }
  if (e.k === 'boat') { const x = e.x * W, y = e.y * H; P.moveTo(x - 16, y - 4); P.lineTo(x + 16, y - 4); P.lineTo(x + 10, y + 2); P.lineTo(x - 10, y + 2); P.closePath(); P.moveTo(x, y - 4); P.lineTo(x, y - 30); P.lineTo(x + 12, y - 6); neonStroke(g, P, pal[1], 1.3); return; }
  if (e.k === 'sheep') { const r = seeded(7); for (let i = 0; i < 16; i++) neonDot(g, r() * W, (e.y0 + r() * (e.y1 - e.y0)) * H, 1.6, '#ffffff', 0.8); return; }
  if (e.k === 'coral') { for (const [x, y, s, col] of e.items) { const C = new Path2D(); for (let k = 0; k < 6; k++) { const h = Math.abs(Math.sin(k * 1.3)) * 30 * s + 6 * s, cx = x * W + (k - 2.5) * 7 * s; C.moveTo(cx, y * H); C.lineTo(cx, y * H - h + 7 * s); C.moveTo(cx + 7 * s, y * H - h); C.arc(cx, y * H - h, 7 * s, 0, Math.PI * 2); } neonStroke(g, C, col, 1.3); } }
}

// Static line art of a place, on a transparent canvas (cached by the theme).
function neonStatic(g, R, pal) {
  const stops = R.layers || [], n = Math.max(1, stops.length - 1);
  const colOf = i => lerpHex(pal[0], pal[1], Math.min(1, i / n));
  if (R.stars) { const r = seeded(3); for (let i = 0; i < R.stars; i++) { g.fillStyle = `rgba(255,255,255,${0.2 + r() * 0.6})`; g.fillRect(r() * W, r() * H * 0.6, 1.3, 1.3); } }
  if (R.milky) { const r = seeded(11); for (let i = 0; i < 160; i++) { const t = r(); g.fillStyle = `rgba(200,210,255,${0.15 + r() * 0.35})`; g.fillRect(W * t + (r() - 0.5) * 50, H * (0.45 - t * 0.35) + (r() - 0.5) * 40, 1.2, 1.2); } }
  if (R.sun) {
    // a striped neon sun
    const x = R.sun.x * W, y = R.sun.y * H, rad = Math.max(30, R.sun.r * 2.2);
    neonDot(g, x, y, rad * 0.9, pal[1], 0.35);
    g.save(); g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.clip();
    const gr = g.createLinearGradient(0, y - rad, 0, y + rad); gr.addColorStop(0, pal[1]); gr.addColorStop(1, pal[0]);
    g.globalAlpha = 0.55; g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); g.globalAlpha = 1;
    g.fillStyle = SHADE; for (let k = 0; k < 6; k++) g.fillRect(x - rad, y + rad * (0.05 + k * 0.16), rad * 2, 2 + k * 1.3);
    g.restore();
    const C = new Path2D(); C.arc(x, y, rad, 0, Math.PI * 2); neonStroke(g, C, pal[1], 1.4);
  }
  if (R.moon) {
    const m = R.moon, x = m.x * W, y = m.y * H, C = new Path2D();
    C.arc(x, y, m.r, Math.PI * 0.35, Math.PI * 1.65); C.arc(x + m.r * 0.45, y - m.r * 0.2, m.r * 0.95, Math.PI * 1.55, Math.PI * 0.45, true);
    neonStroke(g, C, '#f6f3e6', 1.4); neonDot(g, x, y, m.r, '#9fb4ff', 0.25);
  }
  const drawLayer = (L, i) => {
    const P = ridgePaths(L), col = colOf(i);
    g.fillStyle = SHADE; g.fill(P.fill);
    neonStroke(g, P.edge, col, L.k === 'mesa' || L.k === 'terraces' || L.k === 'rows' ? 1.1 : 1.7);
    for (const [x, y] of P.tips) neonDot(g, x, y, 2.2, '#ffffff', 0.9);
    if (L.k === 'field') { const r = seeded(L.p * 5 + 1); for (let k = 0; k < 120; k++) neonDot(g, r() * W, L.b * H + Math.pow(r(), 0.7) * (H - L.b * H), 1.2, col, 0.7); }
  };
  const drawTrees = front => { for (const T of R.trees || []) if (!!T.front === front) for (const [x, y, s] of T.items) { const P = treePath(T.k, x * W, y * H, s); g.fillStyle = SHADE; g.fill(P); neonStroke(g, P, T.k === 'blossom' ? '#ff7ad9' : T.k === 'maple' ? '#ff8a3d' : pal[0], 1.2); } };
  stops.forEach((L, i) => { if (!L.front) drawLayer(L, i); });
  drawTrees(false);
  for (const e of R.extras || []) if (!e.front) extraPaint(g, e, pal);
  if (R.water) {
    const wy = R.water.y * H;
    g.save(); g.beginPath(); g.rect(0, wy, W, H - wy); g.clip();
    g.fillStyle = SHADE; g.fillRect(0, wy, W, H - wy);
    g.translate(0, wy * 2); g.scale(1, -1); g.globalAlpha = R.water.mirror ? 0.6 : 0.28;
    g.drawImage(g.canvas, 0, 0, W, H); g.restore();
    const Hz = new Path2D(); Hz.moveTo(0, wy); Hz.lineTo(W, wy); neonStroke(g, Hz, pal[0], 1.4);
  }
  stops.forEach((L, i) => { if (L.front) drawLayer(L, i); });
  drawTrees(true);
  for (const e of R.extras || []) if (e.front) extraPaint(g, e, pal);
}

// Moving parts of a place; `e` (0..1) is the combo energy, which brings more of them out.
function neonAnim(g, R, pal, now, e) {
  g.save(); g.globalCompositeOperation = 'lighter';
  if (R.aurora) {
    R.aurora.forEach((col, k) => {
      g.strokeStyle = col; g.lineWidth = 2; g.globalAlpha = 0.25 + 0.4 * e; g.beginPath();
      for (let x = 0; x <= W; x += 6) g.lineTo(x, H * 0.18 + Math.sin(x * 0.011 + now / 2400 + k * 1.3) * 34 + k * 20);
      g.stroke();
    });
  }
  if (R.water && R.water.shimmer) {
    const x0 = R.sun ? R.sun.x * W : W / 2; g.fillStyle = pal[1];
    for (let i = 0; i < 8; i++) { const w = 54 - i * 5 + Math.sin(now / 500 + i) * 12; g.globalAlpha = 0.25 + 0.35 * e; g.fillRect(x0 - w / 2, R.water.y * H + 5 + i * 11, w, 1.6); }
  }
  for (const ex of R.extras || []) if (ex.k === 'waterfall') {
    g.fillStyle = '#ffffff';
    for (let i = 0; i < 6; i++) { const x = ex.x * W - ex.w / 2 + (i + 0.5) * ex.w / 6, y = ex.y0 * H + wrapN(now * 0.25 + i * 37, (ex.y1 - ex.y0) * H); g.globalAlpha = 0.6; g.fillRect(x - 0.6, y, 1.2, 12); }
  }
  const P = R.particles || {}, n = Math.round((P.n || 0) * (0.5 + 0.5 * e));
  for (let i = 0; i < n; i++) {
    const k = P.k;
    let x, y, col = pal[i % 2], r = 1.6;
    if (k === 'snow') { x = wrapN(i * 61 + Math.sin(now / 1200 + i) * 16, W); y = wrapN(i * 97 + now * 0.03 * (1 + i % 3), H); col = '#ffffff'; r = 1.2; }
    else if (k === 'bubbles') { y = H - wrapN(i * 71 + now * 0.04 * (1 + i % 3), H); x = wrapN(i * 53, W) + Math.sin(now / 600 + i) * 6; g.globalAlpha = 0.6; g.strokeStyle = pal[0]; g.lineWidth = 1; g.beginPath(); g.arc(x, y, 2 + i % 4, 0, Math.PI * 2); g.stroke(); continue; }
    else if (k === 'petals' || k === 'leaves') { x = wrapN(i * 137 + now * 0.018 * (1 + i % 3) + Math.sin(now / 900 + i) * 14, W + 40) - 20; y = wrapN(i * 91 + now * 0.035 * (1 + i % 4), H + 40) - 20; col = k === 'petals' ? '#ff7ad9' : '#ff8a3d'; }

// Once every place has been seen they return as colour remixes, so stages never run out.
const VARIANTS = [null, { suffix: 'REMIX' }, { suffix: 'HYPER' }, { suffix: 'OVERDRIVE' }];
const landOf = s => {
  const i = wrapN(s, LANDS.length), R = LANDS[i], cyc = Math.floor(s / LANDS.length), V = VARIANTS[cyc % VARIANTS.length];
  const Z = zoneOf(s), pal = Z.pals[(s + cyc) % Z.pals.length];
  return { R, V, Z, pal, name: V ? `${R.name} · ${V.suffix}` : R.name, key: `${R.key}-${Z.key}-${cyc}` };
};
// A small thumbnail of a stage's scene for the map.
const thumbCache = {};
function landThumb(s) {
  const L = landOf(s);
  if (thumbCache[L.key]) return thumbCache[L.key];
  const c = document.createElement('canvas'); c.width = 168; c.height = 312;
  const g = c.getContext('2d'); g.fillStyle = '#04050a'; g.fillRect(0, 0, 168, 312);
  g.scale(168 / W, 312 / H); neonStatic(g, L.R, L.pal);
  return (thumbCache[L.key] = c.toDataURL('image/jpeg', 0.85));
}

// ---- 25-themes.js ----
// Neon: the game's single visual direction. Black stage, sleek neon bricks, and a backdrop
// that stays dark until combos build, then lights up (drawBackdrop in 80-render.js).
// Each stage (and each endless level) takes its accent pair from its landscape.
const FONT = {
  display: '"Chakra Petch", "IBM Plex Sans KR", system-ui, sans-serif',
  plex: '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif',
};
const lerpHex = (a, b, k) => {

// ---- 35-stages.js ----
// Classic mode: stages of 5 levels, without end. Stage s uses landscape s (see 24-landscapes.js).
// Every level ends with its main boss: levels 1-4 send a boss and then the main boss, the 5th level
// of a stage sends two bosses and then the stage boss. Beating them all clears the level.
// Brick HP grows with the overall level index g, so workshop upgrades carry the player forward.
// Each stage also gets one of five brick mixes on top of the base chances in BAL.
const LEVELS_PER_STAGE = 5;
const GIMMICKS = [
  { text: '기본 규칙', mod: {} },
  { text: '레이저 아이템과 강철 벽돌이 많음', mod: { laser: 0.12, steel: 0.05 } },
  { text: '깨지면 갈라지는 슬라임이 많음', mod: { slime: 0.12, orb: 0.1 } },
  { text: '폭탄이 많고 벽돌이 빽빽함', mod: { bomb: 0.1, density: 0.06 } },
  { text: 'XP 상자와 강철 벽돌이 많음, 골드 2배', mod: { chest: 0.02, steel: 0.1 }, gold: 2 },
];
function levelInfo(g) {

  return { g, s, l, id: `${s + 1}-${l + 1}`, bosses: l === LEVELS_PER_STAGE - 1 ? 3 : 2, stageBoss: l === LEVELS_PER_STAGE - 1,
    bossList: l === LEVELS_PER_STAGE - 1 ? ['boss', 'boss', 'stage'] : ['boss', 'main'],
    hpMul: BAL.levelHp(g), goldMul: Math.pow(BAL.goldGrowth, g), mod: G.mod, gold: G.gold || 1, text: G.text, land: s };
}
// Endless: one long run; every boss raises the level and moves to the next landscape.
// Brick HP is scaled by the player's workshop damage multiplier, so 기본 화력 doesn't trivialise it
// (and the weekly ranking stays fair); gold pays like the furthest classic level reached.
const ENDLESS = { endless: true, id: 'ENDLESS', bosses: Infinity, hpMul: 1, goldMul: 1, mod: {}, gold: 1, land: 0 };
const endlessInfo = () => ({ ...ENDLESS, hpMul: dmgMult(SAVE.meta.power), goldMul: Math.pow(BAL.goldGrowth, SAVE.unlocked) });
const ENDLESS_UNLOCK = LEVELS_PER_STAGE; // levels cleared before endless opens
let STG = levelInfo(0);

// Boss kinds: a plain boss is 3 cells wide, the main and stage bosses 5.
const BOSS_KIND = { boss: { span: 3, hp: () => BAL.bossHp }, main: { span: 5, hp: () => BAL.mainBossHp }, stage: { span: 5, hp: () => BAL.stageBossHp } };

  : (STG.stageBoss ? BAL.stageBossTurns : BAL.bossTurns).map(t => t + randIn([-BAL.bossJitter, BAL.bossJitter]));

function setRect(br) { br.X = br.c * CW + 2; br.Y = TOP + br.r * RH + 2; br.Wd = br.span * CW - 4; br.Ht = RH - 4; }

  setRect(br); S.bricks.push(br);

    addBrick({ c, r: 0, span: boss.span, type: 'boss', rank: boss.rank, hp: h * boss.hpMul, chapter: chapterOf(effTurn(t)) }, slide);
    for (let k = 0; k < boss.span; k++) used[c + k] = true;

  for (const b of rowBricks) b.rowSize = rowBricks.length;

// A dying brick shatters into triangular shards that fly along the hit direction.

    if (o.dead || isItem(o)) continue;
    const dx = o.X + o.Wd / 2 - cx, dy = o.Y + o.Ht / 2 - cy, d = Math.hypot(dx, dy);
    if (d > 0 && d < rad) { const f = force * (1 - d / rad); o.kx = (o.kx || 0) + dx / d * f; o.ky = (o.ky || 0) + dy / d * f; }
  }
}
// Several bricks broken within a quarter second escalate into slow motion and a camera punch.
const MULTI = [
  { n: 4, word: 'BREAK', shake: 6, zoom: 0.02, slow: 0, chroma: 0, hap: 30 },
  { n: 8, word: 'SMASH', shake: 10, zoom: 0.035, slow: 0.28, chroma: 0.35, hap: 60 },
  { n: 14, word: 'DEVASTATION', shake: 14, zoom: 0.05, slow: 0.45, chroma: 0.6, hap: 90 },
  { n: 22, word: 'ANNIHILATION', shake: 16, zoom: 0.07, slow: 0.6, chroma: 0.9, hap: 140 },
];
function countBurst() {
  S.burstN++; S.burstT = 0.28;
  const lv = MULTI.findIndex(m => m.n === S.burstN);
  if (lv < 0) return;
  const m = MULTI[lv];
  S.score += 100 * (lv + 1) * S.burstN;
  shake(m.shake); S.camZ = Math.max(S.camZ, m.zoom); S.camR = (rnd() < 0.5 ? -1 : 1) * m.zoom * 0.5;
  S.chroma = Math.max(S.chroma, m.chroma);
  if (m.slow) { S.slowmo = Math.max(S.slowmo, m.slow); sfx.whoosh(); }
  bigWords.push({ s: `${m.word} x${S.burstN}`, life: 1.1, max: 1.1, y: H * 0.46, size: 15 + lv * 3, style: 'slam' });
  sfx.slam(lv); buzz(m.hap);
  if (lv >= 1) { S.flash = 0.25 + lv * 0.08; S.flashCol = '255,255,255'; }
}
function lineClear(br) {
  S.score += 200;
  const y = br.Y + br.Ht / 2;
  beams.push({ x: 0, y: y - 8, w: W, h: 16, life: 0.3, max: 0.3 });
  for (let x = 20; x < W; x += 40) burst(x, y, TH.accent, 3, 200);
  texts.push(mkText(W / 2, y - 6, 'LINE CLEAR', TH.css.gold, 1.1, 14));
  addGold(3, W / 2, y); shake(5); S.camZ = Math.max(S.camZ, 0.02); sfx.laser(); buzz(40);
}
function perfectClear() {
  S.score += 1000;
  S.perfectDone = true;
  bigWords.push({ s: 'PERFECT!', life: 1.8, max: 1.8, y: H * 0.38, size: 30, style: 'slam' });
  S.slowmo = Math.max(S.slowmo, 0.8); S.flash = 0.7; S.flashCol = '255,255,255'; S.chroma = 1; S.camZ = 0.08; shake(14);
  for (let i = 0; i < 8; i++) burst(W * (i + 0.5) / 8, TOP + 120 + rnd() * 300, TH.accent, 24, 420);
  addGold(10 + S.turn, W / 2, H * 0.45); sfx.whoosh(); sfx.slam(3); sfx.clear(); buzz(200);
}

// The main boss goes down: slow motion, a slam word and light along its whole body.
function mainBossDown(br) {
  S.slowmo = Math.max(S.slowmo, 0.7); S.chroma = 1; S.camZ = 0.08; S.pulse = 1;
  bigWords.push({ s: 'BOSS DOWN', life: 1.6, max: 1.6, y: H * 0.24, size: 26, style: 'slam' });
  for (let i = 0; i < 5; i++) burst(br.X + br.Wd * (i + 0.5) / 5, br.Y + br.Ht / 2, i % 2 ? TH.accent : TH.css.gold, 26, 420);
  for (let i = 0; i < 3; i++) if (pillars.length < 24) pillars.push({ x: br.X + br.Wd * (i + 0.5) / 3, y: br.Y + br.Ht / 2, w: 44, col: TH.css.gold, life: 0.5, max: 0.5 });
  sfx.slam(3); buzz(220);
}

function kill(br) {
  br.dead = true; clearCells(br);
  const cx = br.X + br.Wd / 2, cy = br.Y + br.Ht / 2, boss = br.type === 'boss';
  shatter(br);
  // light: a bloom where it broke, a pillar of light, and a flash on the black behind it
  const lc = br.col || brickColor(br);
  if (blooms.length < 40) blooms.push({ x: cx, y: cy, r: boss ? 160 : 70, col: lc, life: 0.3, max: 0.3 });
  if (pillars.length < 24) pillars.push({ x: cx, y: cy, w: boss ? br.Wd * 0.6 : 26, col: lc, life: 0.35, max: 0.35 });
  if (bgFlashes.length < 14) bgFlashes.push({ x: cx, y: cy, col: lc, life: 0.5, max: 0.5 });
  S.pulse = Math.min(1, (S.pulse || 0) + (boss ? 1 : 0.22));
  burst(cx, cy, br.col || brickColor(br), boss ? 50 : 5, boss ? 380 : 220);
  pops.push({ x: br.X, y: br.Y, w: br.Wd, h: br.Ht, life: 0.22, max: 0.22 });
  shockwave(cx, cy, CW * (boss ? 4 : 1.7), boss ? 14 : 5);
  countBurst();
  // endless score: combo and how deep into the run you are both multiply it
  S.score += Math.round(10 * (1 + S.combo * 0.1) * (1 + S.turn / 20));
  sfx.crunch(S.burstN);
  if (!boss && br.rowSize >= 4 && !S.bricks.some(o => !o.dead && !isItem(o) && o.r === br.r)) lineClear(br);
  if (!S.perfectDone && S.phase === 'fire' && !S.bricks.some(o => !o.dead && !isItem(o))) perfectClear();
  S.combo++; S.kills++; S.comboPulse = 1; S.maxCombo = Math.max(S.maxCombo, S.combo);
  if (S.comboMile < COMBO_MILES.length && S.combo >= COMBO_MILES[S.comboMile]) {
    bigWords.push({ s: TH.words[S.comboMile], life: 1.1, max: 1.1, y: H * 0.3, size: 16 + S.comboMile * 2 });
    S.comboMile++; shake(5); sfx.clear(); buzz(40);
  }
  if (S.combo >= 20 && !S.fever) { S.fever = true; S.flash = 0.35; S.flashCol = '255,255,255'; }
  if (!boss && rnd() < (S.fever ? 0.5 : 0.25)) flyCoin(cx, cy);
  shake(boss ? 14 : 1.2);
  sfx.brk(S.combo); buzz(boss ? 80 : 8);
  const bonus = BAL.xpTurnBonus ? Math.floor(S.turn / BAL.xpTurnBonus) : 0;
  if (boss) {
    const big = isBigBoss(br);
    S.bosses++; S.hitstop = big ? 0.24 : 0.16;
    if (big) S.mainDown = true;
    if (STG.endless) { S.worldPending = true; S.score += 500 * (S.world + 1); }
    else if (S.bosses >= STG.bosses) S.cleared = true;
    // time the next boss: a random gap after this one arrived, and a short rest after this kill
    if (!S.cleared) S.nextBossTurn = Math.max(S.bossTurns ? S.bossTurns[S.bossIdx] : S.lastBossTurn + randIn(BAL.endlessGap), S.turn + BAL.bossRest);
    if (!S.cleared) gainXp(BAL.xpBoss); // no level-up popping over the clear
    S.flash = 0.6; S.flashCol = '255,255,255';
    addGold((BAL.goldBoss + BAL.goldChapter(br.chapter)) * (big ? 2 : 1), cx, cy);
    if (big) mainBossDown(br);
    if (S.cleared) showBanner('LEVEL CLEAR', `레벨 ${STG.id} 돌파!`, TH.css.gold);
    else if (STG.endless) showBanner(`LEVEL ${S.world + 1} CLEAR`, '보스 격파!', TH.css.gold);
    else {
      const next = nextBossRank(), left = S.nextBossTurn - S.turn;
      showBanner('BOSS DOWN', `${next === 'main' ? '메인 보스' : next === 'stage' ? '스테이지 보스' : '다음 보스'}까지 ${left}턴`, TH.css.gold);
    }
    sfx.clear();
  } else if (br.type === 'steel') { gainXp(BAL.xpSteel + bonus); addGold(2, cx, cy); }
  else { gainXp(BAL.xpBrick + bonus); addGold(BAL.goldPerKill); }
  if (br.type === 'bomb') S.blasts.push({ x: cx, y: cy, rad: CW * 1.6, dmg: Math.ceil(effTurn(S.turn) * 1.5 * STG.hpMul) + S.dmg * 2, kind: 'bomb', t: 0.06 });
  if (br.type === 'chest') { S.level++; S.pendingLevels++; texts.push(mkText(cx, cy, '+LV', TH.css.gold, 1, 14)); sfx.lvl(); } // counts toward the boss gates
  if (br.type === 'slime') splitSlime(br);
  if (S.lv.fire > 0) S.blasts.push({ x: cx, y: cy, rad: CW * 1.15, dmg: S.dmg * (1.5 + S.lv.fire), kind: 'fire', t: 0.07 });
}

// A slime splits into up to two small bricks in free neighbouring cells.
function splitSlime(br) {
  const cand = [[br.r, br.c - 1], [br.r, br.c + 1], [br.r + 1, br.c], [br.r - 1, br.c]]
    .filter(([r, c]) => r >= 0 && r < ROWS - 1 && c >= 0 && c < COLS && !grid[r * COLS + c]);
  let n = 0;
  for (const [r, c] of cand) {
    if (n >= 2) break;
    const X = c * CW + 2, Y = TOP + r * RH + 2;
    if (S.movers.some(b => b.x + b.r > X && b.x - b.r < X + CW - 4 && b.y + b.r > Y && b.y - b.r < Y + RH - 4)) continue;
    const kid = addBrick({ c, r, span: 1, type: 'n', hp: Math.max(1, Math.ceil(br.maxHp / 3)) }, false);
    kid.flash = 1; n++;
  }
  if (n) { sfx.slime(); burst(br.X + br.Wd / 2, br.Y + br.Ht / 2, '#7dffb0', 10, 160); }
}

function processBlasts(dt) {
  if (!S.blasts.length) return;
  for (const b of S.blasts) b.t -= dt;
  const due = S.blasts.filter(b => b.t <= 0);
  S.blasts = S.blasts.filter(b => b.t > 0);
  for (const b of due) {
    const col = b.kind === 'bomb' ? TH.css.hot : '#ff8a3d';
    rings.push({ x: b.x, y: b.y, r: b.rad, life: 0.3, max: 0.3, col });
    burst(b.x, b.y, col, b.kind === 'bomb' ? 22 : 8, 260);
    if (b.kind === 'bomb') { shake(7); sfx.boom(); buzz(30); S.hitstop = Math.max(S.hitstop, 0.04); } else shake(1.2);
    for (const br of S.bricks) {
      if (br.dead || isItem(br)) continue;
      const dx = Math.max(br.X - b.x, 0, b.x - (br.X + br.Wd)), dy = Math.max(br.Y - b.y, 0, b.y - (br.Y + br.Ht));
      if (dx * dx + dy * dy <= (b.rad * 0.55) ** 2) {
        const ux = br.X + br.Wd / 2 - b.x, uy = br.Y + br.Ht / 2 - b.y, ul = Math.hypot(ux, uy) || 1;
        br.kdx = ux / ul; br.kdy = uy / ul;
        dealDamage(br, b.dmg, false);
      }
    }
  }
}

function zap(from) {
  const fx = from.X + from.Wd / 2, fy = from.Y + from.Ht / 2;
  const cand = S.bricks.filter(b => !b.dead && b !== from && !isItem(b))
    .map(b => ({ b, d: (b.X + b.Wd / 2 - fx) ** 2 + (b.Y + b.Ht / 2 - fy) ** 2 }))
    .sort((a, b) => a.d - b.d).slice(0, S.lv.chain + 1);
  let px = fx, py = fy;
  for (const { b } of cand) {
    const tx = b.X + b.Wd / 2, ty = b.Y + b.Ht / 2, pts = [[px, py]];
    for (let i = 1; i < 6; i++) pts.push([px + (tx - px) * i / 6 + (rnd() - 0.5) * 16, py + (ty - py) * i / 6 + (rnd() - 0.5) * 16]);
    pts.push([tx, ty]);
    bolts.push({ pts, life: 0.16, max: 0.16 });
    dealDamage(b, S.dmg * 1.5, false);
    px = tx; py = ty;
  }
  if (cand.length) sfx.zap();
}

// Acid: stacks left by hits all burst at the end of the turn, then halve.
function acidTick() {
  let any = false;
  for (const br of S.bricks) {
    if (br.dead || isItem(br) || !br.acid) continue;
    const d = br.acid * S.dmg * 0.3;
    texts.push(mkText(br.X + br.Wd / 2, br.Y + 4, fmtDmg(Math.round(d * 10) / 10), UPG.acid.col, 0.8, 9));
    burst(br.X + br.Wd / 2, br.Y + br.Ht / 2, UPG.acid.col, 4, 120);
    br.acid = Math.floor(br.acid / 2);
    dealDamage(br, d, false);
    any = true;
  }
  if (any) { sfx.slime(); shake(2); }
  return any;
}

// Laser items fire once per ball that passes through them.
function fireLaser(item) {
  item.flash = 1;
  if (item.type === 'lzh') {
    beams.push({ x: 0, y: item.Y + item.Ht / 2 - 5, w: W, h: 10, life: 0.18, max: 0.18 });
    for (const br of S.bricks) if (!br.dead && !isItem(br) && br.r === item.r) dealDamage(br, S.dmg, false);
  } else {
    beams.push({ x: item.X + item.Wd / 2 - 5, y: TOP, w: 10, h: FB - TOP, life: 0.18, max: 0.18 });
    for (const br of S.bricks) if (!br.dead && !isItem(br) && br.c <= item.c && item.c < br.c + br.span) dealDamage(br, S.dmg, false);
  }
  sfx.laser();
}

function hitBrick(br, b) {
  let d = S.dmg, crit = false;
  // knockback and shards push the brick away from the ball
  const ux = br.X + br.Wd / 2 - b.x, uy = br.Y + br.Ht / 2 - b.y, ul = Math.hypot(ux, uy) || 1;
  br.kdx = ux / ul; br.kdy = uy / ul;
  if (parts.length < 600) for (let i = 0; i < 2; i++) {
    const a = Math.atan2(b.vy, b.vx) + (rnd() - 0.5) * 1.2, v = 260 + rnd() * 220;
    parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.18, max: 0.22, size: 2.4, col: '#ffffff', kind: 'spark', rot: 0, vr: 0, g: 0 });
  }
  if (b.iron) d *= S.lv.iron + 1;
  if (S.lv.rush) {
    d *= 1 + b.rush * 0.2 * S.lv.rush;
    b.rush = Math.min(20, b.rush + 1);
    if (Math.hypot(b.vx, b.vy) < BAL.ballSpeed * 1.6) { b.vx *= 1.03; b.vy *= 1.03; }
  }
  if (S.lv.acid && !isItem(br)) br.acid = (br.acid || 0) + S.lv.acid;
  if (S.crit && rnd() < S.crit) { d *= 3; crit = true; }
  if (br.type === 'steel') sfx.steel(); else sfx.hit();
  dealDamage(br, d, crit);
  S.hits++;
  if (S.lv.chain > 0 && S.hits % zapEvery(S.lv.chain) === 0) zap(br);
  if (S.lv.split > 0 && !b.temp && !b.split) {
    b.split = true;
    const sp = Math.hypot(b.vx, b.vy);
    for (let k = 1; k <= S.lv.split; k++) {
      const a = Math.atan2(b.vy, b.vx) + (k % 2 ? 1 : -1) * 0.32 * Math.ceil(k / 2);
      let vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
      if (Math.abs(vy) < sp * 0.14) { vy = Math.sign(vy || -1) * sp * 0.14; vx = Math.sign(vx || 1) * Math.sqrt(sp * sp - vy * vy); }
      S.movers.push(mkBall(b.x, b.y, vx, vy, true));
    }
  }
}

// ---- 60-physics.js ----
// Ball movement. The ball collides as a square (AABB) against bricks, one axis at a time,
// in sub-steps shorter than its radius so it never tunnels through a brick.
function mkBall(x, y, vx, vy, temp) {
  return { x, y, vx, vy, r: ballR(), alive: true, temp, split: false, ghost: new Set(), touched: new Set(), trail: [], rush: 0, fb: 0, iron: false };
}
function overlaps(b, br) { return b.x + b.r > br.X && b.x - b.r < br.X + br.Wd && b.y + b.r > br.Y && b.y - b.r < br.Y + br.Ht; }

function touchItem(b, br, r, c) {
  const dx = b.x - (br.X + br.Wd / 2), dy = b.y - (br.Y + br.Ht / 2);
  if (dx * dx + dy * dy >= (b.r + 10) ** 2) return;
  if (br.type === 'orb') {
    br.dead = true; grid[r * COLS + c] = null; S.orbsGot++;
    texts.push(mkText(br.X + br.Wd / 2, br.Y + 6, '+1', TH.accent, 0.8, 11));
    rings.push({ x: br.X + br.Wd / 2, y: br.Y + br.Ht / 2, r: 30, life: 0.25, max: 0.25, col: TH.accent });
    sfx.orb();
  } else if (!b.touched.has(br)) {
    b.touched.add(br); fireLaser(br);
  }
}

// true when the ball overlaps any solid brick other than `skip`
function overlapsOther(b, skip) {
  const c0 = Math.max(0, Math.floor((b.x - b.r) / CW)), c1 = Math.min(COLS - 1, Math.floor((b.x + b.r) / CW));
  const r0 = Math.max(0, Math.floor((b.y - b.r - TOP) / RH)), r1 = Math.min(ROWS - 1, Math.floor((b.y + b.r - TOP) / RH));
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const o = grid[r * COLS + c];
    if (o && o !== skip && !o.dead && !isItem(o) && !b.ghost.has(o) && overlaps(b, o)) return true;
  }
  return false;
}
function collide(b, axis, prev) {
  const c0 = Math.max(0, Math.floor((b.x - b.r) / CW)), c1 = Math.min(COLS - 1, Math.floor((b.x + b.r) / CW));
  const r0 = Math.max(0, Math.floor((b.y - b.r - TOP) / RH)), r1 = Math.min(ROWS - 1, Math.floor((b.y + b.r - TOP) / RH));
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const br = grid[r * COLS + c];
    if (!br || br.dead) continue;
    if (isItem(br)) { touchItem(b, br, r, c); continue; }
    if (b.ghost.has(br) || !overlaps(b, br)) continue;
    if (b.iron) { b.ghost.add(br); hitBrick(br, b); continue; } // iron ball ploughs through
    if (S.pierce && rnd() < S.pierce) { b.ghost.add(br); hitBrick(br, b); continue; }
    // Push out on the side the ball's centre is on (not by velocity sign), and never
    // through a wall: a ball squeezed between a brick and the wall bounces vertically.
    let nx = null;
    if (axis === 0) {
      const left = b.x < br.X + br.Wd / 2;
      nx = left ? br.X - b.r - 0.01 : br.X + br.Wd + b.r + 0.01;
      if (nx >= b.r && nx <= W - b.r) { b.x = nx; b.vx = left ? -Math.abs(b.vx) : Math.abs(b.vx); }
      else nx = null;
    }
    if (nx === null) {
      const up = b.y < br.Y + br.Ht / 2;
      b.y = up ? br.Y - b.r - 0.01 : br.Y + br.Ht + b.r + 0.01;
      b.vy = up ? -Math.abs(b.vy) : Math.abs(b.vy);
    }
    // wedged in a corner between two bricks: step back to where this move started
    if (overlapsOther(b, br)) { if (axis === 0) b.x = prev; else b.y = prev; }
    hitBrick(br, b);
    return;
  }
}

function moveBall(b, dt) {
  const sp = Math.hypot(b.vx, b.vy);
  const n = Math.max(1, Math.ceil(sp * dt / (b.r * 0.9)));
  for (let i = 0; i < n && b.alive; i++) {
    const px = b.x;
    b.x += b.vx * dt / n;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); sfx.wall(); }
    else if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); sfx.wall(); }
    collide(b, 0, px);
    const py = b.y;
    b.y += b.vy * dt / n;
    if (b.y < TOP + b.r) { b.y = TOP + b.r; b.vy = Math.abs(b.vy); sfx.wall(); }
    collide(b, 1, py);
    if (b.ghost.size) for (const g of b.ghost) if (g.dead || !overlaps(b, g)) b.ghost.delete(g);
    if (b.vy > 0 && b.y >= LY && b.fb < S.lv.bounce && rnd() < 0.25 * S.lv.bounce) {
      // bounce pad: 25% a level to send the ball back up, at most once a level per ball
      b.fb++; b.y = LY - 0.5; b.vy = -Math.abs(b.vy);
      rings.push({ x: b.x, y: LY, r: 26, life: 0.22, max: 0.22, col: UPG.bounce.col }); sfx.wall();
    } else if (b.vy > 0 && b.y >= LY) {
      b.alive = false;
      if (!b.temp) {
        if (S.nextLaunchX === null) S.nextLaunchX = clamp(b.x, 12, W - 12);
        homers.push({ x: b.x });
      }
    }
  }
  b.trail.push(b.x, b.y);
  if (b.trail.length > 10) b.trail.splice(0, 2);
}

// Aim guide: trace the shot through its first bounce, using the same collision rules.
function hitTest(x, y, r) {
  const c0 = Math.max(0, Math.floor((x - r) / CW)), c1 = Math.min(COLS - 1, Math.floor((x + r) / CW));
  const r0 = Math.max(0, Math.floor((y - r - TOP) / RH)), r1 = Math.min(ROWS - 1, Math.floor((y + r - TOP) / RH));
  for (let rr = r0; rr <= r1; rr++) for (let c = c0; c <= c1; c++) {
    const br = grid[rr * COLS + c];
    if (br && !br.dead && !isItem(br) && x + r > br.X && x - r < br.X + br.Wd && y + r > br.Y && y - r < br.Y + br.Ht) return true;
  }
  return false;
}
function aimPath() {
  const r = ballR(), st = 4;
  let x = S.launchX, y = LY, dx = S.aim.x * st, dy = S.aim.y * st;
  const pre = [], post = []; let hit = null, after = 0;
  for (let i = 0; i < 600; i++) {
    let bounced = false;
    x += dx;
    if (x < r || x > W - r || hitTest(x, y, r)) { x -= dx; dx = -dx; bounced = true; }
    y += dy;
    if (y < TOP + r || hitTest(x, y, r)) { y -= dy; dy = -dy; bounced = true; }
    if (bounced && hit) break;
    if (bounced) hit = { x, y };
    if (!hit) { if (i % 4 === 3) pre.push(x, y); }
    else { after += st; if (i % 4 === 3) post.push(x, y); if (after > 120) break; }
    if (dy > 0 && y >= LY) break;
  }
  return { pre, post, hit };
}

// ---------- level-up ----------
function pickUpgrades(n) {
  const pool = Object.keys(UPG).filter(k => S.lv[k] < UPG[k].max)
    .map(k => ({ k, w: UPG[k].w }));
  const out = [];
  while (out.length < n && pool.length) {
    let x = rnd() * pool.reduce((a, p) => a + p.w, 0), i = 0;
    while (x > pool[i].w) { x -= pool[i].w; i++; }
    out.push(pool.splice(i, 1)[0].k);
  }
  return out;
}
function showLevel() {

  for (const k of curChoices) {
    const u = UPG[k], l = S.lv[k];
    const lvl = u.max <= 6
      ? `<span class="lv">${Array.from({ length: u.max }, (_, i) => `<i class="${i < l ? 'on' : i === l ? 'nx' : ''}"></i>`).join('')}</span>`
      : `<span class="lvt">LV ${l} &gt; ${l + 1}</span>`;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'card'; b.style.setProperty('--c', u.col);
    b.innerHTML = `${l === 0 ? '<span class="new">NEW</span>' : ''}<span class="ic"><svg viewBox="0 0 24 24">${ICONS[k]}</svg></span>`
      + `<span class="cn">${u.name}</span>${lvl}<span class="cd">${u.desc(l + 1)}</span>`;
    b.onclick = () => pickCard(k, b);
    cardsEl.appendChild(b);
  }
  // restart the entrance animations when the overlay is reused for a second pick
  lvlEl.hidden = true; void lvlEl.offsetWidth; lvlEl.hidden = false;
  lvlEl.classList.add('locked');
  setTimeout(() => lvlEl.classList.remove('locked'), 200);
}
// Tap feedback: the chosen card pops, the others fade, then the choice applies.
function pickCard(k, el) {
  if (lvlEl.classList.contains('locked') || S.phase !== 'levelup') return;

  const r = el.getBoundingClientRect(), cr = cv.getBoundingClientRect();

// ---------- per-frame update ----------
function update(dt) {
  if (S.hitstop > 0) { S.hitstop -= dt; updateFx(dt * 0.2); return; }
  // slow motion after big multi-breaks: the world runs at 28%, effects at 45%
  const slow = S.slowmo > 0 ? 0.28 : 1;
  S.slowmo = Math.max(0, S.slowmo - dt);
  heartbeat(dt);
  if (slow < 1) { updateWorld(dt * slow); updateFx(dt * 0.45); return; }
  updateWorld(dt);
  updateFx(dt);
}
// one life: when bricks close in on the red line the heart beats faster
function heartbeat(dt) {
  if (S.danger <= 0 || (S.phase !== 'aim' && S.phase !== 'fire')) return;
  S.beat -= dt;
  if (S.beat <= 0) { S.beat = 1.0 - 0.45 * S.danger; S.beatPulse = 1; sfx.beat(); if (S.danger >= 0.75) buzz(15); }
}
function updateWorld(dt) {
  if (S.phase === 'fire') {
    S.turnTime += dt;
    S.timeScale = S.turnTime > 14 ? 4 : S.turnTime > 8 ? 3 : S.turnTime > 4 ? 2 : 1;
    if (S.turnTime > 1.5 && recallEl.hidden) recallEl.hidden = false;
    if (S.turnTime > 45 && S.movers.length) recall(); // safety: no turn runs forever (e.g. endless bounce loops)
    const gdt = dt * S.timeScale;
    if (S.burstT > 0) { S.burstT -= gdt; if (S.burstT <= 0) S.burstN = 0; }
    if (S.toFire > 0) {
      S.fireTimer -= gdt;
      const sp = BAL.ballSpeed;
