    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(s, s); outlined(t.s, 0, 0, t.col, t.size); ctx.restore();
  }
  ctx.globalAlpha = 1;
  if (S.phase === 'fire' && S.combo >= 5) {
    const s = 1 + S.comboPulse * 0.4, size = Math.min(22, 11 + S.combo * 0.2);
    const col = S.combo >= 20 ? `hsl(${(now / 3) % 360},100%,62%)` : S.combo >= 15 ? TH.css.gold : TH.accent;
    ctx.save(); ctx.translate(W / 2, TOP + 52); ctx.scale(s, s);
    outlined('COMBO ' + S.combo, 0, 0, col, size);
    ctx.restore();
  }
  for (const bw of bigWords) drawBigWord(bw, now);
  ctx.restore(); // end shake

  // impact ghosting: two offset copies of the frame right after a big break
  if (S.chroma > 0.02) {
    const off = S.chroma * 7 * dpr * scale;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = TH.light ? 'multiply' : 'lighter'; ctx.globalAlpha = S.chroma * 0.28;
    ctx.drawImage(cv, off, 0); ctx.drawImage(cv, -off, 0);
    ctx.restore();
  }
  // danger: red pulse from the bottom when bricks approach the red line
  if (S.danger > 0 && (S.phase === 'aim' || S.phase === 'fire')) {
    const a = S.danger * (0.18 + 0.22 * (S.beatPulse || 0));
    const g = ctx.createLinearGradient(0, FB - 220, 0, FB + 10);
    g.addColorStop(0, 'rgba(255,40,70,0)'); g.addColorStop(1, `rgba(255,40,70,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, FB - 220, W, 230);
    if (S.danger >= 0.5 && Math.floor(now / 350) % 2 === 0) { ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; outlined('DANGER', W / 2, FB - 16, '#ff2846', 10); }
  }
  // coins flying to the HUD gold counter
  for (const c of flyers) {
    const k = clamp(c.t / c.dur, 0, 1), e = k * k, x = (1 - e) * ((1 - k) * c.sx + k * c.cx) + e * W / 2, y = (1 - e) * ((1 - k) * c.sy + k * c.cy) + e * 50;
    ctx.drawImage(glow(TH.css.gold), x - 9, y - 9, 18, 18);
    ctx.beginPath(); ctx.ellipse(x, y, 4.5 * Math.abs(Math.cos(c.t * 14)) + 0.8, 4.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd54a'; ctx.fill(); ctx.strokeStyle = '#a8740a'; ctx.lineWidth = 1; ctx.stroke();
  }

  // fever frame
  if (S.fever) {
    const a = 0.45 + 0.35 * Math.sin(now / 90);
    ctx.strokeStyle = `hsla(${(now / 3) % 360},100%,60%,${a})`; ctx.lineWidth = 8; ctx.strokeRect(4, TOP + 4, W - 8, LY - TOP - 4);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    outlined('FEVER!', W / 2, TOP + 84, TH.fever, 10);
  }

  // banner
  if (S.banner) {
    const b = S.banner, k = b.life / b.max, a = Math.min(1, k * 4, (1 - k) * 8);
    ctx.globalAlpha = a;
    ctx.fillStyle = TH.css.ov; ctx.fillRect(0, H * 0.4 - 46, W, 92);
    ctx.fillStyle = b.col; ctx.fillRect(0, H * 0.4 - 46, W, 4); ctx.fillRect(0, H * 0.4 + 42, W, 4);
    if (b.warn) { // main boss: hazard stripes scrolling above and below the banner
      for (const [yy, dir] of [[H * 0.4 - 64, 1], [H * 0.4 + 48, -1]]) {
        ctx.save(); ctx.beginPath(); ctx.rect(0, yy, W, 16); ctx.clip();
        ctx.fillStyle = 'rgba(12,0,8,.88)'; ctx.fillRect(0, yy, W, 16); ctx.fillStyle = b.col;
        const off = (now / 16 * dir) % 28;
        for (let xx = -56 + off; xx < W + 56; xx += 28) { ctx.beginPath(); ctx.moveTo(xx, yy + 16); ctx.lineTo(xx + 14, yy); ctx.lineTo(xx + 25, yy); ctx.lineTo(xx + 11, yy + 16); ctx.closePath(); ctx.fill(); }
        ctx.restore();
      }
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    outlined(b.title, W / 2, H * 0.4 - 12, b.col, 18);
    ctx.font = KO(22); ctx.fillStyle = TH.css.ink; ctx.fillText(b.sub, W / 2, H * 0.4 + 20);
    ctx.globalAlpha = 1;
  }

  // world change: a bright iris opening from the centre
  if (S.wipe > 0) {
    const k = 1 - S.wipe;
    ctx.save(); ctx.globalAlpha = S.wipe;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(W / 2, H * 0.45, k * 700, 0, Math.PI * 2, true); ctx.fill('evenodd');
    ctx.strokeStyle = TH.accent; ctx.lineWidth = 10 * S.wipe; ctx.beginPath(); ctx.arc(W / 2, H * 0.45, k * 700, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  drawHud(now, ch);

  if (S.phase === 'fire' && S.timeScale > 1) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    outlined('FAST x' + S.timeScale, W / 2, H - 22, TH.accent, 9);
  } else if (S.phase === 'aim' && !S.aiming) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.globalAlpha = 0.55 + 0.45 * Math.sin(now / 300);
    outlined('HOLD & AIM', W / 2, H - 22, TH.css.dim, 8); ctx.globalAlpha = 1;
  }
  if (S.flash > 0) { ctx.fillStyle = `rgba(${S.flashCol},${S.flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
}

// ---- 85-rank.js ----
// Weekly endless-mode leaderboard, kept in the artifact's shared database (db capability).
// One document per player at lb/<userId>: { season, score, level, turn, at, lastSeason, lastScore }.
// A new week starts on Monday (UTC). When a player opens the game after a week ends, the
// previous week's top three get their reward once: 1st the champion crown, a golden ball and
// 1000G; 2nd and 3rd 300G (both inflated like the player's furthest classic level). Outside claude.ai (for example in the Expo app) there is no shared
// store, so the board says so and only the local best is kept.
const RANK = { db: null, user: null, me: null, writable: null, state: 'loading', rows: [], names: {} };
const REWARD = { 1: { gold: 1000, crown: true }, 2: { gold: 300 }, 3: { gold: 300 } };

function seasonId(d = new Date()) {
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear(), week = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
  return `${y}-W${String(week).padStart(2, '0')}`;
}
const prevSeasonId = () => seasonId(new Date(Date.now() - 7 * 864e5));
function seasonEndsIn() {
  const now = new Date(), day = now.getUTCDay() || 7;
  const end = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + (8 - day));
  const h = Math.max(0, Math.floor((end - now) / 36e5));
  return h >= 24 ? `${Math.floor(h / 24)}일 ${h % 24}시간` : `${h}시간`;
}
const withTimeout = (p, ms = 10000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

async function rankInit() {
  if (!window.claude || typeof window.claude.use !== 'function') { RANK.state = 'offline'; return; }
  try {
    const [db, user] = await withTimeout(Promise.all([window.claude.use('db'), window.claude.use('user')]));
    if (!db || !user) { RANK.state = 'offline'; return; }
    RANK.db = db; RANK.user = user;
    RANK.me = await user.id();
    RANK.writable = await user.can('data.write');
    RANK.state = 'ready';
    checkChampion();
  } catch (e) { RANK.state = 'offline'; }
}

async function submitScore(score, level, turn) {
  if (RANK.state !== 'ready' || !RANK.me || RANK.writable === false || score <= 0) return;
  const ref = RANK.db.doc('lb/' + RANK.me), season = seasonId();
  try {
    const snap = await withTimeout(ref.get());
    const cur = snap.exists ? snap.data() : null;
    if (cur && cur.season === season && cur.score >= score) return;
    const carry = cur && cur.season !== season ? { lastSeason: cur.season, lastScore: cur.score } : { lastSeason: cur ? cur.lastSeason || '' : '', lastScore: cur ? cur.lastScore || 0 : 0 };
    await withTimeout(ref.set({ season, score, level, turn, at: Date.now(), ...carry }));
  } catch (e) {
    if (e && e.code === 'invalid_argument') RANK.writable = false;
  }
}

async function loadBoard() {
  if (RANK.state !== 'ready') return [];
  const snap = await withTimeout(RANK.db.collection('lb').where('season', '==', seasonId()).orderBy('score', 'desc').limit(50).get());
  const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  try { const ps = await RANK.user.profiles(rows.map(r => r.id)); for (const r of rows) r.name = (ps[r.id] && ps[r.id].name) || ''; } catch (e) {}
  return rows;
}

// Last week's standings come from two places: players still on that season, and players who
// already moved on (their old score sits in lastSeason/lastScore).
async function checkChampion() {
  const prev = prevSeasonId();
  if (RANK.state !== 'ready' || SAVE.champSeasons[prev] !== undefined) return;
  try {
    const col = RANK.db.collection('lb');
    const [a, b] = await withTimeout(Promise.all([
      col.where('season', '==', prev).orderBy('score', 'desc').limit(3).get(),
      col.where('lastSeason', '==', prev).orderBy('lastScore', 'desc').limit(3).get(),
    ]));
    const all = [...a.docs.map(d => ({ id: d.id, s: d.data().score })), ...b.docs.map(d => ({ id: d.id, s: d.data().lastScore }))]
      .sort((x, y) => y.s - x.s).slice(0, 3);
    const place = all.findIndex(r => r.id === RANK.me) + 1;
    SAVE.champSeasons[prev] = place;
    if (REWARD[place]) {
      const gold = Math.round(REWARD[place].gold * Math.pow(BAL.goldGrowth, SAVE.unlocked)); // inflates like level gold
      SAVE.gold += gold;
      if (REWARD[place].crown) SAVE.champion = true;
      showTitleNote(place === 1 ? `지난주 무한 모드 1위! 챔피언 왕관과 황금 공, ${fmtGold(gold)}를 받았어요` : `지난주 무한 모드 ${place}위! ${fmtGold(gold)}를 받았어요`);
      if (REWARD[place].crown) applyTheme(TH.land);
      refreshTitle();
    }
    writeSave();
  } catch (e) {}
}
function showTitleNote(text) { const n = $('titleNote'); n.textContent = text; n.hidden = false; }

// ---------- leaderboard screen ----------
let rankReturn = null;
async function openRank(from) {
  rankReturn = from; if (from) from.hidden = true;
  $('rank').hidden = false;
  $('rankSeason').textContent = `${seasonId()} 시즌 · 종료까지 ${seasonEndsIn()}`;
  $('rankMine').textContent = SAVE.bestScore ? `내 최고 점수 ${SAVE.bestScore.toLocaleString()}` : '아직 기록이 없어요';
  const list = $('rankList');
  if (RANK.state === 'offline') { list.innerHTML = '<p class="note">랭킹은 claude.ai에서 게임을 열었을 때 함께 겨룰 수 있어요. 지금은 내 기록만 저장됩니다.</p>'; return; }
  if (RANK.state !== 'ready') { list.innerHTML = '<p class="note">랭킹을 불러오는 중…</p>'; setTimeout(() => { if (!$('rank').hidden) openRank(from); }, 1500); return; }
  list.innerHTML = '<p class="note">랭킹을 불러오는 중…</p>';
  try {
    const rows = await loadBoard();
    if (!rows.length) { list.innerHTML = '<p class="note">이번 주 첫 기록의 주인공이 되어보세요!</p>'; }
    else list.innerHTML = rows.map((r, i) => `<div class="rrow${r.id === RANK.me ? ' me' : ''}"><b>${i + 1}</b><span>${escapeHtml(r.name || (r.id === RANK.me ? '나' : '플레이어'))}</span><em>LV ${r.level}</em><i>${Number(r.score).toLocaleString()}</i></div>`).join('');
    if (RANK.writable === false) list.insertAdjacentHTML('beforeend', '<p class="note">보기 권한이라 기록을 올릴 수 없어요. 공유한 사람에게 참여 권한을 받으면 함께 겨룰 수 있어요.</p>');
  } catch (e) {
    list.innerHTML = '<p class="note">랭킹을 지금 불러올 수 없어요. 잠시 후 다시 열어주세요.</p>';
  }
}
function closeRank() { $('rank').hidden = true; if (rankReturn) rankReturn.hidden = false; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ---- 90-main.js ----
// Screen fit, input, buttons and the main loop.
let scale = 1, dpr = 1;
function resize() {
  scale = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  stage.style.width = W * scale + 'px'; stage.style.height = H * scale + 'px';
  stage.style.setProperty('--s', scale);
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize);
resize();

// Aim by pointing where the shot should go; drag below the launcher line to cancel.
function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
function setAim(e) {
  const p = toLocal(e);
  if (p.y > LY - 8) { S.aimOk = false; return; }
  let dx = p.x - S.launchX, dy = p.y - LY;
  const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
  const minDy = -0.14;
  if (dy > minDy) { dy = minDy; dx = Math.sign(dx || 1) * Math.sqrt(1 - dy * dy); }
  S.aim = { x: dx, y: dy }; S.aimOk = true;
}
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  if (S.phase !== 'aim') return;
  S.aiming = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  setAim(e);
});
cv.addEventListener('pointermove', e => { if (S.aiming) setAim(e); });
cv.addEventListener('pointerup', () => { if (S.aiming) { S.aiming = false; if (S.aimOk && S.phase === 'aim') fire(); } });
cv.addEventListener('pointercancel', () => { S.aiming = false; });

sndEl.onclick = () => { muted = !muted; sndEl.textContent = muted ? 'SND OFF' : 'SND ON'; ensureAudio(); };
recallEl.onclick = recall;
$('start').onclick = () => startLevel(nextLevelIndex());
$('again').onclick = againOrNext;
$('endless').onclick = startEndless;
$('titleMap').onclick = () => openMap(titleEl);
$('overMap').onclick = () => openMap(overEl);
$('mapClose').onclick = closeMap;
$('mapPlay').onclick = () => startLevel(mapSel);
$('titleRank').onclick = () => openRank(titleEl);
$('overRank').onclick = () => openRank(overEl);
$('rankClose').onclick = closeRank;
$('titleShop').onclick = () => openShop(titleEl);
$('overShop').onclick = () => openShop(overEl);
$('shopClose').onclick = closeShop;
$('shieldTake').onclick = takeShield; // ad placeholder: a rewarded ad would play here
$('shieldSkip').onclick = hideShieldOffer;
$('claim').onclick = () => claim(1);
$('claim2x').onclick = () => claim(2); // ad placeholder

// ---------- boot ----------
loadSave();
STG = levelInfo(nextLevelIndex());
applyTheme(STG.land);
newRun(); S.phase = 'title';
refreshTitle();
rankInit();
// #land-7 previews landscape 7 on the title screen (for browsing the places)
function previewFromHash() { const m = location.hash.match(/^#land-(\d+)$/); if (m && S.phase === 'title') applyTheme(+m[1]); }
addEventListener('hashchange', previewFromHash);
previewFromHash();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Debug and balance-simulation hook (used by the headless balance bot).
window.__bm = {
  get state() { return S; },
  get save() { return SAVE; },
  BAL,
  tick(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); },
  shoot(angle) { if (S.phase !== 'aim') return; S.aim = { x: Math.cos(angle), y: Math.sin(angle) }; fire(); },
  pick(i) { if (S.phase === 'levelup' && curChoices[i]) choose(curChoices[i]); },
  give(k) { S.lv[k]++; UPG[k].apply(); }, // balance benches: add a card without a level-up
  UPG,
  newRun(meta, stage) { if (meta) Object.assign(SAVE.meta, meta); STG = stage === undefined ? STG : stage < 0 ? endlessInfo() : levelInfo(stage); newRun(); if (S.pendingLevels > 0) showLevel(); },
  theme(id) { applyTheme(id); },
  levelInfo, landOf, LANDS, META, metaCost, clearBonus,
  // render landscape s (with its animated parts) to an image, for galleries
  landShot(s, w = 210, now = 4000) {
    const c = document.createElement('canvas'); c.width = w * 2; c.height = Math.round(w * H / W) * 2;
    const g = c.getContext('2d'); g.scale(c.width / W, c.height / H);
    const L = landOf(s); g.fillStyle = '#04050a'; g.fillRect(0, 0, W, H); neonStatic(g, L.R, L.pal); neonAnim(g, L.R, L.pal, now, 1);
    return c.toDataURL('image/jpeg', 0.85);
  },
  word(i) { bigWords.push({ s: TH.words[i], life: 0.85, max: 1.1, y: H * 0.3, size: 16 + i * 2 }); },
  draw(now = performance.now()) { draw(now); },
};

})();
